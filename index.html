<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Edge Detector HUD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            pointer-events: none;
            z-index: 10;
            text-transform: uppercase;
            font-size: 12px;
        }

        .status-blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        button {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="output-canvas"></canvas>
    
    <div id="ui-layer">
        <div>System: Active</div>
        <div class="status-blink">Scanning Environment...</div>
        <div id="fps-counter">FPS: 0</div>
    </div>

    <div id="controls">
        <button onclick="toggleInversion()">Invert Style</button>
        <button onclick="changeSensitivity()">Sensitivity</button>
    </div>
</div>

<script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
</script>

<script id="fragmentShader" type="x-shader/x-fragment">
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform float sensitivity;
    uniform bool invert;

    void main() {
        vec2 texel = 1.0 / resolution;
        
        // Матрица Собеля для детектирования границ
        vec4 center = texture2D(tDiffuse, vUv);
        float grayC = (center.r + center.g + center.b) / 3.0;

        float top = (texture2D(tDiffuse, vUv + vec2(0.0, texel.y)).rgb).g;
        float bottom = (texture2D(tDiffuse, vUv - vec2(0.0, texel.y)).rgb).g;
        float left = (texture2D(tDiffuse, vUv - vec2(texel.x, 0.0)).rgb).g;
        float right = (texture2D(tDiffuse, vUv + vec2(texel.x, 0.0)).rgb).g;

        float edge = abs(left - right) + abs(top - bottom);
        edge = smoothstep(0.1, sensitivity, edge);

        vec3 edgeColor = vec3(0.0, 1.0, 0.5); // Киберпанк бирюзовый/зеленый
        
        if (invert) {
            gl_FragColor = vec4(edgeColor * edge, 1.0);
        } else {
            // Смешивание оригинала с гранями
            gl_FragColor = vec4(center.rgb * 0.3 + edgeColor * edge, 1.0);
        }
    }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    let scene, camera, renderer, videoTexture, material;
    let sensitivityValue = 0.4;
    let isInverted = true;
    const video = document.getElementById('video');
    const fpsCounter = document.getElementById('fps-counter');
    let lastTime = 0;

    async function init() {
        // Настройка камеры мобильного устройства
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            video.srcObject = stream;
            await video.play();
        } catch (err) {
            console.error("Error accessing camera:", err);
            alert("Не удалось получить доступ к камере.");
        }

        // Инициализация Three.js
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        
        renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('output-canvas'),
            antialias: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);

        videoTexture = new THREE.VideoTexture(video);
        
        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                tDiffuse: { value: videoTexture },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                sensitivity: { value: sensitivityValue },
                invert: { value: isInverted }
            },
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent
        });

        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function onWindowResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        material.uniforms.resolution.value.set(width, height);
    }

    function toggleInversion() {
        isInverted = !isInverted;
        material.uniforms.invert.value = isInverted;
    }

    function changeSensitivity() {
        sensitivityValue = sensitivityValue > 0.2 ? sensitivityValue - 0.1 : 0.6;
        material.uniforms.sensitivity.value = sensitivityValue;
    }

    function animate(now) {
        requestAnimationFrame(animate);
        
        // Расчет FPS
        const delta = now - lastTime;
        lastTime = now;
        if (delta > 0) {
            fpsCounter.innerText = `FPS: ${Math.round(1000 / delta)}`;
        }

        renderer.render(scene, camera);
    }

    // Запуск при загрузке
    window.addEventListener('load', init);
</script>

</body>
</html>
