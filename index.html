<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Video Interface</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { margin: 0; background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; }
        
        /* Стилизация видео под "тактический" интерфейс */
        .video-wrapper { position: relative; border: 2px solid #00ff41; box-shadow: 0 0 15px rgba(0, 255, 65, 0.3); width: 90%; max-width: 640px; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .controls { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px 20px; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        button:active { background: #00ff41; color: #000; }
        
        #status { position: absolute; top: 10px; left: 10px; font-size: 10px; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="video-wrapper">
        <div id="status">SYSTEM: STANDBY</div>
        <video id="main-video" class="video-js vjs-default-skin" playsinline muted></video>
        <canvas id="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
    </div>

    <div class="controls">
        <button onclick="startCamera()">Запустить камеру</button>
        <button onclick="initPeer()">Создать Peer ID</button>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    let player = videojs('main-video');
    let model;
    let peer;

    // 1. Оптимизированный запрос к камере
    async function startCamera() {
        const constraints = {
            video: {
                facingMode: "user", // "environment" для задней камеры
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            const videoElement = document.querySelector('video');
            videoElement.srcObject = stream;
            videoElement.play();
            
            document.getElementById('status').innerText = "SYSTEM: CAMERA_ACTIVE";
            
            // Запуск ИИ после активации камеры
            initAI();
        } catch (err) {
            console.error("Ошибка доступа:", err);
            alert("Не удалось получить доступ к камере. Проверьте разрешения.");
        }
    }

    // 2. Инициализация TensorFlow.js (BlazeFace для детекции лиц)
    async function initAI() {
        model = await blazeface.load();
        detect();
    }

    async function detect() {
        const video = document.querySelector('video');
        if (video.readyState === 4) {
            const predictions = await model.estimateFaces(video, false);
            // Тут можно рисовать на canvas поверх видео
            if (predictions.length > 0) {
                document.getElementById('status').innerText = `SYSTEM: TARGET_DETECTED (${predictions.length})`;
            }
        }
        requestAnimationFrame(detect); // Цикл обработки
    }

    // 3. Инициализация PeerJS для P2P связи
    function initPeer() {
        peer = new Peer();
        peer.on('open', (id) => {
            console.log('My peer ID is: ' + id);
            alert('Ваш ID: ' + id);
        });
        
        peer.on('call', (call) => {
            navigator.mediaDevices.getUserMedia({video: true}).then((stream) => {
                call.answer(stream);
                call.on('stream', (remoteStream) => {
                    // Отображение удаленного потока
                });
            });
        });
    }

    // 4. Поддержка HLS (через hls.js для Android/Chrome)
    function loadHLS(url) {
        if (Hls.isSupported()) {
            let hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(document.querySelector('video'));
        } else if (document.querySelector('video').canPlayType('application/vnd.apple.mpegurl')) {
            // Родная поддержка Safari
            document.querySelector('video').src = url;
        }
    }
</script>
</body>
</html>
