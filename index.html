<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>myDASH</title>
<style>
:root{--acc:#C6F542;--bg:#0B0B0C;--card:#19191B;--card2:#232326;--mut:#8A8A8E;--red:#FF453A;--amb:#FFD60A;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none;}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.3);z-index:1;}
#vid.mir{transform:scaleX(-1);}
#cv{position:absolute;inset:0;z-index:2;}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:3;display:none;touch-action:none;}
body.m3 #gl{display:block;}
body.m3 #cv{visibility:hidden;}
body.m3 .oe{display:none!important;}
body:not(.m3) .o3{display:none!important;}
#joy{position:absolute;z-index:7;width:96px;height:96px;border-radius:50%;border:1px solid rgba(198,245,66,.5);background:rgba(35,35,38,.4);display:none;pointer-events:none;transform:translate(-50%,-50%);}
#knob{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(198,245,66,.55);left:50%;top:50%;transform:translate(-50%,-50%);}
#toastbox{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:var(--card);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;padding:8px 14px;border-radius:12px;white-space:nowrap;}
#subs{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:5;background:rgba(25,25,27,.92);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 14px;display:none;flex-direction:column;gap:8px;pointer-events:none;}
#subs.on{display:flex;}
#eq{width:100%;height:26px;display:block;}
#sline{font-size:14px;line-height:1.4;min-height:1.4em;max-height:2.8em;overflow:hidden;}
#sfin{color:#fff;}
#sint{color:var(--mut);}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(22,22,24,.97);border-top:1px solid rgba(255,255,255,.07);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:0 calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));}
#grip{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);background-clip:content-box;box-sizing:content-box;padding:10px 36px;margin:0 auto;flex:none;display:none;touch-action:none;}
#dock.open #grip{display:block;}
#dsec{overflow:hidden;max-height:0;transition:max-height .3s ease;}
#dock.open #dsec{max-height:56vh;}
.dpane{display:none;}
.dscroll{overflow-y:auto;touch-action:pan-y;max-height:52vh;padding:2px 8px 10px;}
#lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 8px 14px;}
#lgrid .chip{height:42px;}
#erow{display:flex;gap:10px;justify-content:center;padding:14px 8px 16px;}
#erow .chip{min-width:88px;height:44px;}
.chip{background:var(--card2);border:1px solid rgba(255,255,255,.08);color:#fff;border-radius:12px;font:inherit;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;touch-action:manipulation;}
.chip.off{color:var(--mut);border-color:transparent;}
.chip.dead{opacity:.25;}
.chip.warn{color:var(--red);border-color:rgba(255,69,58,.35);}
.chip:active{transform:scale(.95);}
#drow{display:flex;align-items:center;justify-content:center;gap:3px;padding-top:6px;overflow-x:auto;scrollbar-width:none;}
#modetab{background:var(--card2);border-radius:12px;padding:3px;display:flex;flex:none;gap:2px;}
.mt{width:48px;height:40px;border-radius:9px;background:transparent;border:none;color:var(--mut);font:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s,transform .08s;}
.mt.on{background:var(--acc);color:#0B0B0C;}
#drow .btn{width:44px;height:54px;flex:none;background:transparent;border:none;border-radius:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation;transition:background .15s,color .15s,transform .08s;}
.btn svg{width:20px;height:20px;fill:var(--mut);}
.btn span{font-size:10px;letter-spacing:.2px;}
.btn.on{color:var(--acc);background:rgba(198,245,66,.12);}
.btn.on svg{fill:var(--acc);}
.btn:active{transform:scale(.92);}
.btn.off{opacity:.35;}
.tgl{background:var(--card2);border:1px solid rgba(255,255,255,.08);color:var(--acc);border-radius:10px;font:inherit;font-size:11px;font-weight:700;min-width:54px;height:28px;cursor:pointer;touch-action:manipulation;}
.tgl.off{color:var(--mut);}
.btnpair{display:flex;gap:8px;}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px;}
.srow input[type=range]{flex:1;max-width:52%;accent-color:var(--acc);height:28px;touch-action:none;}
.sv{min-width:36px;text-align:right;color:var(--mut);font-size:11px;}
.sh{font-size:11px;letter-spacing:1.5px;color:var(--mut);font-weight:700;margin:14px 0 4px;}
#settabs{display:flex;gap:8px;padding:10px 0 8px;}
#settabs .chip{flex:1;height:36px;}
.chip.on{background:var(--acc);color:#0B0B0C;border-color:transparent;}
#steno{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px;font-size:13px;line-height:1.4;}
.sl b{color:var(--mut);font-weight:600;margin-right:8px;font-size:11px;}
#vrow{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;}
#vrow .chip{min-width:62px;height:38px;}
#s-reset,#e-reset{margin:14px auto 6px;display:block;background:transparent;border:1px solid rgba(255,69,58,.5);color:var(--red);font:inherit;font-size:12px;font-weight:600;letter-spacing:.5px;padding:10px 24px;border-radius:12px;cursor:pointer;}
#loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s;}
#loader.out{opacity:0;pointer-events:none;}
#lhead{font-size:28px;font-weight:800;letter-spacing:.5px;}
#lhead::after{content:'●';color:var(--acc);font-size:14px;margin-left:6px;vertical-align:super;}
.bar{width:220px;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;}
#fill{height:100%;width:0;background:var(--acc);transition:width .35s;}
#fill.err{background:var(--red);}
#ltxt{font-size:13px;color:var(--mut);text-align:center;max-width:84vw;line-height:1.5;}
#ltxt.err{color:var(--red);}
#retry,#lstart{background:var(--acc);border:none;color:#0B0B0C;font:inherit;font-size:13px;font-weight:700;letter-spacing:.5px;padding:12px 28px;border-radius:12px;cursor:pointer;margin-top:4px;}
@media(hover:hover){
  #drow .btn:hover,.mt:hover{background:rgba(255,255,255,.06);color:#fff;}
  #drow .btn:hover svg{fill:#fff;}
  #drow .btn.on:hover{background:rgba(198,245,66,.16);color:var(--acc);}
  #drow .btn.on:hover svg{fill:var(--acc);}
  .chip:hover,.tgl:hover{border-color:rgba(255,255,255,.28);}
  .mt.on:hover{background:var(--acc);color:#0B0B0C;}
}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
.mt:active,.tgl:active{transform:scale(.93);}
#drow::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<canvas id="cv"></canvas>
<canvas id="gl"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="toastbox"></div>
<div id="subs"><canvas id="eq" width="320" height="26"></canvas><div id="sline"><span id="sfin"></span><span id="sint"></span></div></div>
<div id="dock">
  <div id="grip"></div>
  <div id="dsec">
    <div class="dpane" id="p-set"><div class="dscroll">
      <div id="settabs">
        <button class="chip on" id="st-e">ЕФІР</button>
        <button class="chip" id="st-3">3D</button>
      </div>
      <div id="sg-e">
        <div class="srow"><span>ЯСКРАВІСТЬ ВІДЕО</span><input type="range" id="r-br" min="15" max="60" step="1"><span class="sv" id="v-br"></span></div>
        <div class="srow"><span>ТЕССЕЛЯЦІЯ</span><button class="tgl" id="g-tess">ВКЛ</button></div>
        <div class="srow"><span>ПРОЗОРІСТЬ ТЕСС.</span><input type="range" id="r-ta" min="5" max="50" step="1"><span class="sv" id="v-ta"></span></div>
        <div class="srow"><span>ТОВЩИНА ЛІНІЙ</span><input type="range" id="r-lw" min="10" max="30" step="1"><span class="sv" id="v-lw"></span></div>
        <div class="srow"><span>БАРИ МІМІКИ</span><button class="tgl" id="g-bars">ВКЛ</button></div>
        <div class="srow"><span>КОМПАС + ДИСТ</span><button class="tgl" id="g-pose">ВКЛ</button></div>
        <div class="srow"><span>ПОГЛЯД</span><button class="tgl" id="g-gaze">ВКЛ</button></div>
        <div class="srow"><span>ПОРІГ ОБ'ЄКТІВ</span><input type="range" id="r-thr" min="30" max="80" step="5"><span class="sv" id="v-thr"></span></div>
        <div class="srow"><span>КОНТУР СЕГМ.</span><button class="tgl" id="g-edge">ВКЛ</button></div>
        <div class="srow"><span>ЗАТЕМНЕННЯ СЕГМ.</span><button class="tgl" id="g-dim">ВКЛ</button></div>
        <div class="srow"><span>МАСКА ПРОЗОРІСТЬ</span><input type="range" id="r-mo" min="20" max="100" step="5"><span class="sv" id="v-mo"></span></div>
        <div class="srow"><span>ФОТО МАСКИ</span><span class="btnpair"><button class="tgl" id="g-photo">ОБРАТИ</button><button class="tgl" id="g-photoclr">СКИНУТИ</button></span></div>
      </div>
      <div id="sg-3" hidden>
        <div class="srow"><span>РОЗМІР ТОЧОК</span><input type="range" id="r-pt" min="50" max="200" step="10"><span class="sv" id="v-pt"></span></div>
        <div class="srow"><span>СІТКА-ПІДЛОГА</span><button class="tgl" id="g-grid">ВКЛ</button></div>
        <div class="srow"><span>ШВИДКІСТЬ ПОЛЬОТУ</span><input type="range" id="r-fs" min="50" max="400" step="10"><span class="sv" id="v-fs"></span></div>
      </div>
      <button id="s-reset">СКИНУТИ ВСЕ</button>
    </div></div>
    <div class="dpane" id="p-layers">
      <div id="lgrid">
        <button class="chip" id="c-face">ЛИЦЕ</button>
        <button class="chip" id="c-gest">ЖЕСТИ</button>
        <button class="chip" id="c-pose">ПОЗА</button>
        <button class="chip" id="c-seg">СЕГМ</button>
        <button class="chip" id="c-obj">ОБ'ЄКТИ</button>
        <button class="chip warn" id="c-clear">СТЕРТИ</button>
      </div>
    </div>
    <div class="dpane" id="p-edit">
      <div class="dscroll">
        <div class="sh">РЕДАКТОР ТОЧОК</div>
        <div class="srow"><span id="e-stat">Тапни по точці хмари</span></div>
        <div class="srow"><span>РАДІУС</span><input type="range" id="e-rad" min="5" max="80" step="5"><span class="sv" id="ve-rad"></span></div>
        <div class="srow"><span>ВІСЬ ТЯГИ</span><span class="btnpair"><button class="tgl" id="ax-x">X</button><button class="tgl off" id="ax-y">Y</button><button class="tgl off" id="ax-z">Z</button></span></div>
        <button id="e-reset">СКИНУТИ ДЕФОРМАЦІЇ</button>
      </div>
    </div>
    <div class="dpane" id="p-export">
      <div id="erow">
        <button class="chip" id="e-ply">PLY</button>
        <button class="chip" id="e-obj">OBJ</button>
        <button class="chip" id="e-glb">GLB</button>
      </div>
    </div>
    <div class="dpane" id="p-voice">
      <div class="dscroll">
        <div class="sh">СТЕНОГРАМА</div>
        <div id="steno"></div>
        <div id="vrow">
          <button class="chip off" id="v-mic">МІКРО</button>
          <button class="chip" id="v-lang">UK</button>
          <button class="chip" id="v-txt">TXT</button>
          <button class="chip" id="v-doc">DOC</button>
          <button class="chip" id="v-pdf">PDF</button>
          <button class="chip warn" id="v-clr">СТЕРТИ</button>
        </div>
      </div>
    </div>
  </div>
  <div id="drow">
    <div id="modetab">
      <button class="mt on" id="m-efir">ЕФІР</button>
      <button class="mt" id="m-3d">3D</button>
    </div>
    <button class="btn oe" id="b-flip" aria-label="Змінити камеру"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg><span>Фліп</span></button>
    <button class="btn oe" id="b-layers" aria-label="Шари"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg><span>Шари</span></button>
    <button class="btn oe" id="b-mask" aria-label="Маска"><svg viewBox="0 0 24 24"><path d="M9 11.75c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25S9.69 11.75 9 11.75zm6 0c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25S15.69 11.75 15 11.75zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-4c-2.33 0-4.32-1.45-5.12-3.5h1.67c.69 1.19 1.97 2 3.45 2s2.75-.81 3.45-2h1.67c-.8 2.05-2.79 3.5-5.12 3.5z"/></svg><span>Маска</span></button>
    <button class="btn o3" id="b-dive" aria-label="Пірнути"><svg viewBox="0 0 24 24"><path d="M11 4h2v10.17l3.59-3.58L18 12l-6 6-6-6 1.41-1.41L11 14.17V4zM4 20h16v2H4v-2z"/></svg><span>Пірнути</span></button>
    <button class="btn o3" id="b-edit" aria-label="Редактор"><svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg><span>Редакт</span></button>
    <button class="btn o3" id="b-export" aria-label="Експорт"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg><span>Експорт</span></button>
    <button class="btn" id="b-mic" aria-label="Мова"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg><span>Мова</span></button>
    <button class="btn" id="b-set" aria-label="Налаштування"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 0 0 .06-.94 7 7 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7 7 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.19.12.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg><span>Налашт</span></button>
  </div>
</div>
<div id="loader">
  <div id="lhead">myDASH</div>
  <div class="bar"><div id="fill"></div></div>
  <div id="ltxt">Розганяю тачку…</div>
  <button id="lstart" hidden>СТАРТ</button>
  <button id="retry" hidden>ЩЕ РАЗ</button>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const vid=$('vid'), cv=$('cv'), ctx=cv.getContext('2d'), glc=$('gl');
const ltxt=$('ltxt'), fill=$('fill'), loader=$('loader'), retry=$('retry');

const ACC='#C6F542', WHT='#FFFFFF', AMBER='#FFD60A', RED='#FF453A';
const ACC_D='rgba(255,255,255,.55)';
const TESS_COL='rgba(198,245,66,0.16)';
const VER='0.10.14';
const CDN=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`;
const MODELS='https://storage.googleapis.com/mediapipe-models';
const FONT="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";

//#region PURE — чиста математика, ганяється у headless-харнесі
function coverMap(vw,vh,W,H){
  const s=Math.max(W/vw,H/vh), dw=vw*s, dh=vh*s;
  return { s, dw, dh, ox:(W-dw)/2, oy:(H-dh)/2 };
}
// Зважений round-robin: [['face',2],['gest',2],['pose',1]] -> f,g,p,f,g
function buildQueue(items){
  const left=items.map(i=>i[1]), q=[];
  let rem=left.reduce((a,b)=>a+b,0);
  while(rem>0){
    for(let i=0;i<items.length;i++){
      if(left[i]>0){ q.push(items[i][0]); left[i]--; rem--; }
    }
  }
  return q;
}
// Кути з колонково-мажорної 4x4 (розклад YXZ: yaw->pitch->roll)
function eulerFromMat(d){
  const r02=d[8], r22=d[10], r12=d[9], r10=d[1], r11=d[5];
  const cl=v=>Math.max(-1,Math.min(1,v));
  return { yaw:Math.atan2(r02,r22), pitch:Math.asin(cl(-r12)), roll:Math.atan2(r10,r11) };
}
// Marching squares по сітці gw x gh, поріг t.
// Повертає плоский масив сегментів [x0,y0,x1,y1,...] у координатах сітки.
function marchingSquares(v,gw,gh,t){
  const seg=[];
  const ix=(a,b)=>{ const f=b-a; return f?Math.max(0,Math.min(1,(t-a)/f)):0.5; };
  for(let y=0;y<gh-1;y++){
    const row=y*gw, row2=(y+1)*gw;
    for(let x=0;x<gw-1;x++){
      const tl=v[row+x], tr=v[row+x+1], br=v[row2+x+1], bl=v[row2+x];
      let c=0; if(tl>t)c|=8; if(tr>t)c|=4; if(br>t)c|=2; if(bl>t)c|=1;
      if(c===0||c===15) continue;
      const T=[x+ix(tl,tr),y], R=[x+1,y+ix(tr,br)], B=[x+ix(bl,br),y+1], L=[x,y+ix(tl,bl)];
      const add=(p,q)=>{ seg.push(p[0],p[1],q[0],q[1]); };
      switch(c){
        case 1: add(L,B); break;   case 14: add(L,B); break;
        case 2: add(B,R); break;   case 13: add(B,R); break;
        case 3: add(L,R); break;   case 12: add(L,R); break;
        case 4: add(T,R); break;   case 11: add(T,R); break;
        case 6: add(T,B); break;   case 9:  add(T,B); break;
        case 7: add(L,T); break;   case 8:  add(L,T); break;
        case 5:{ const m=(tl+tr+br+bl)/4;

function mapPt(p,a,mir){

// Збирач хмари: сутності -> спільні вершини/кольори/ребра (offset-індексація)
function buildCloud(ents,a,mir,c,s){
  const pos=[], col=[], edges=[];
  for(const e of ents){
    for(const lm of e.lms){
      const base=pos.length/3;
      for(const p of lm){
        const m=mapPt(p,a,mir);
        pos.push((m[0]-c[0])*s,(m[1]-c[1])*s,(m[2]-c[2])*s);
        col.push(e.color[0],e.color[1],e.color[2]);
      }
      if(e.poly){ for(let i=0;i+1<lm.length;i++) edges.push(base+i,base+i+1); }
      else for(const cn of e.conns) edges.push(base+cn.start,base+cn.end);
    }
  }
  return { pos, col, edges };
}

function writePLY(c){

    'element vertex '+n+'\nproperty float x\nproperty float y\nproperty float z\n'+
    'property uchar red\nproperty uchar green\nproperty uchar blue\n'+
    'element edge '+m+'\nproperty int vertex1\nproperty int vertex2\nend_header\n';
  for(let i=0;i<n;i++){

       Math.round(c.col[o]*255)+' '+Math.round(c.col[o+1]*255)+' '+Math.round(c.col[o+2]*255)+'\n';
  }

function writeOBJ(c){

// GLB: бінарний glTF 2.0, POINTS + LINES, COLOR_0, uint16-індекси
function writeGLB(c){
  const n=c.pos.length/3;
  const pos=new Float32Array(c.pos), col=new Float32Array(c.col), idx=new Uint16Array(c.edges);
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<n;i++) for(let k=0;k<3;k++){
    const v=pos[i*3+k]; if(v<mn[k])mn[k]=v; if(v>mx[k])mx[k]=v;
  }
  if(!n){ mn.fill(0); mx.fill(0); }
  const pad4=x=>(4-x%4)%4;
  const bPos=pos.byteLength, bCol=col.byteLength, bIdx=idx.byteLength;
  const binLen=bPos+bCol+bIdx+pad4(bIdx);
  const json={ asset:{version:"2.0",generator:"myDASH"}, scene:0, scenes:[{nodes:[0]}],
    nodes:[{mesh:0,name:"mydash_cloud"}],
    meshes:[{primitives:[
      {attributes:{POSITION:0,COLOR_0:1},mode:0},
      {attributes:{POSITION:0,COLOR_0:1},indices:2,mode:1}]}],
    buffers:[{byteLength:binLen}],
    bufferViews:[
      {buffer:0,byteOffset:0,byteLength:bPos},
      {buffer:0,byteOffset:bPos,byteLength:bCol},
      {buffer:0,byteOffset:bPos+bCol,byteLength:bIdx}],
    accessors:[
      {bufferView:0,componentType:5126,count:n,type:"VEC3",min:mn,max:mx},
      {bufferView:1,componentType:5126,count:n,type:"VEC3"},
      {bufferView:2,componentType:5123,count:idx.length,type:"SCALAR"}] };
  let js=JSON.stringify(json);
  js+=' '.repeat(pad4(js.length));
  const total=12+8+js.length+8+binLen;
  const buf=new ArrayBuffer(total), dv=new DataView(buf), u8=new Uint8Array(buf);
  let o=0;
  dv.setUint32(o,0x46546C67,true); o+=4;
  dv.setUint32(o,2,true); o+=4;
  dv.setUint32(o,total,true); o+=4;
  dv.setUint32(o,js.length,true); o+=4;
  dv.setUint32(o,0x4E4F534A,true); o+=4;
  for(let i=0;i<js.length;i++) u8[o+i]=js.charCodeAt(i);
  o+=js.length;
  dv.setUint32(o,binLen,true); o+=4;
  dv.setUint32(o,0x004E4942,true); o+=4;
  u8.set(new Uint8Array(pos.buffer),o); o+=bPos;
  u8.set(new Uint8Array(col.buffer),o); o+=bCol;
  u8.set(new Uint8Array(idx.buffer),o);
  return buf;
}
// bbox плоского масиву [x,y,z,...] -> {mn,mx} або null
function bboxOf(flat){
  if(!flat.length) return null;
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<flat.length;i+=3) for(let k=0;k<3;k++){
    const v=flat[i+k]; if(v<mn[k])mn[k]=v; if(v>mx[k])mx[k]=v;
  }
  return { mn, mx };
}
// Фіт: центр bbox + масштаб до цільового пів-розміру (кламп 0.5–12)
function fitFromBbox(mn,mx,target){
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  const ext=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2;
  const s=Math.min(12,Math.max(0.5,target/(ext||1e-6)));
  return { c, s };
}
// Ластик: викидає точки в радіусі r (по x,y), ріже штрих на шматки,
// шматки коротші за 2 точки гинуть.
function eraseStrokes(strokes,ex,ey,r){
  const out=[], r2=r*r;
  for(const st of strokes){
    let run=[];
    for(const p of st.pts){
      const dx=p.x-ex, dy=p.y-ey;
      if(dx*dx+dy*dy>r2) run.push(p);
      else { if(run.length>1) out.push({pts:run}); run=[]; }
    }
    if(run.length>1) out.push({pts:run});
  }
  return out;
}
// Правдоподібність руки: ріже фантомні «руки» на зубах/обличчі.
// face: {minx,miny,maxx,maxy} або null. Кисть = дистанція зап'ястя(0) -> MCP(9).
function handPlausible(lm,face){
  const sc=Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y);
  if(sc<0.045) return false;
  if(face){
    let inx=0;
    for(const p of lm)
      if(p.x>=face.minx&&p.x<=face.maxx&&p.y>=face.miny&&p.y<=face.maxy) inx++;
    const fw=Math.max(face.maxx-face.minx,face.maxy-face.miny);
    if(inx>=lm.length*0.9 && sc<fw*0.55) return false;
  }
  return true;
}
// PDF-райтер: сторінки-JPEG -> бінарний PDF 1.4 (DCTDecode, без шрифтів)
function writePDF(pages){
  const enc=s=>{ const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&0xFF; return u; };
  const chunks=[]; let pos=0;
  const offs=[];
  const push=u=>{ chunks.push(u); pos+=u.length; };
  const obj=(n,body)=>{ offs[n]=pos; push(enc(n+' 0 obj\n'+body+'\nendobj\n')); };
  push(enc('%PDF-1.4\n'));
  const N=pages.length;
  const kids=[]; for(let i=0;i<N;i++) kids.push((3+i*3)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
  for(let i=0;i<N;i++){
    const p=pages[i], pn=3+i*3, xn=4+i*3, cn=5+i*3;
    obj(pn,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+p.w+' '+p.h+'] /Resources << /XObject << /Im'+i+' '+xn+' 0 R >> >> /Contents '+cn+' 0 R >>');
    offs[xn]=pos;
    push(enc(xn+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpeg.length+' >>\nstream\n'));
    push(p.jpeg);
    push(enc('\nendstream\nendobj\n'));
    const cs='q '+p.w+' 0 0 '+p.h+' 0 0 cm /Im'+i+' Do Q';
    obj(cn,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  }
  const xrefPos=pos;
  const total=3+N*3;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++) x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  x+='trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xrefPos+'\n%%EOF';
  push(enc(x));
  const out=new Uint8Array(pos);
  let o=0;
  for(const c of chunks){ out.set(c,o); o+=c.length; }
  return out.buffer;
}
// Тріангуляція з ребер: пошук 3-клік; кожен трикутник рівно раз
function trisFromEdges(conns){
  const adj=new Map();
  const add=(a,b)=>{ if(!adj.has(a)) adj.set(a,new Set()); adj.get(a).add(b); };
  for(const c of conns){ add(c.start,c.end); add(c.end,c.start); }
  const tris=[];
  for(const c of conns){
    const a=Math.min(c.start,c.end), b=Math.max(c.start,c.end);
    const na=adj.get(a), nb=adj.get(b);
    for(const v of na){
      if(v<=b) continue;
      if(nb.has(v)) tris.push(a,b,v);
    }
  }
  return tris;
}
// Афінна з 3 пар точок: s,d = [x0,y0,x1,y1,x2,y2] -> [a,b,c,d,e,f] для setTransform
function affineOf(s,d){
  const [x0,y0,x1,y1,x2,y2]=s, [u0,v0,u1,v1,u2,v2]=d;
  const den=x0*(y1-y2)+x1*(y2-y0)+x2*(y0-y1);
  if(!den) return null;
  return [
    (u0*(y1-y2)+u1*(y2-y0)+u2*(y0-y1))/den,
    (v0*(y1-y2)+v1*(y2-y0)+v2*(y0-y1))/den,
    (u0*(x2-x1)+u1*(x0-x2)+u2*(x1-x0))/den,
    (v0*(x2-x1)+v1*(x0-x2)+v2*(x1-x0))/den,
    (u0*(x1*y2-x2*y1)+u1*(x2*y0-x0*y2)+u2*(x0*y1-x1*y0))/den,
    (v0*(x1*y2-x2*y1)+v1*(x2*y0-x0*y2)+v2*(x0*y1-x1*y0))/den
  ];
}
// Матриця обертання Rz*Ry*Rx (row-major, 9 елементів)
function eulToMat(rx,ry,rz){
  const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry),cz=Math.cos(rz),sz=Math.sin(rz);
  return [
    cz*cy, cz*sy*sx-sz*cx, cz*sy*cx+sz*sx,
    sz*cy, sz*sy*sx+cz*cx, sz*sy*cx-cz*sx,
    -sy,   cy*sx,          cy*cx
  ];
}
// Застосувати R·v*s + t у плоский масив
function applyXf(x,y,z,R,s,t,out,o){
  out[o]  =(R[0]*x+R[1]*y+R[2]*z)*s+t[0];
  out[o+1]=(R[3]*x+R[4]*y+R[5]*z)*s+t[1];
  out[o+2]=(R[6]*x+R[7]*y+R[8]*z)*s+t[2];
}
// М'який спад по квадрату дистанції: (1-d²/r²)² в межах r
function falloff2(d2,r){
  if(r<=0) return 0;
  const rr=r*r;
  if(d2>=rr) return 0;
  const q=1-d2/rr;
  return q*q;
}
// Стек м'яких деформацій над плоским масивом точок (fit-простір)
function applyTweaks(pos,tweaks){
  for(const t of tweaks){
    const cx=t.c[0], cy=t.c[1], cz=t.c[2];
    const ox=t.o[0], oy=t.o[1], oz=t.o[2];
    for(let i=0;i<pos.length;i+=3){
      const dx=pos[i]-cx, dy=pos[i+1]-cy, dz=pos[i+2]-cz;
      const w=falloff2(dx*dx+dy*dy+dz*dz,t.r);
      if(w>0){ pos[i]+=ox*w; pos[i+1]+=oy*w; pos[i+2]+=oz*w; }
    }
  }
  return pos;
}

      make:()=>mk(PoseLandmarker,[`${MODELS}/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`],
        { numPoses:1 }) },
    seg:{ msg:'Сегментація тут (legacy)', set:v=>SG=v, make:mkSeg },
    obj:{ msg:'Обʼєкти бачу (COCO)', set:v=>OD=v, make:mkObj }
  };
  const names=Object.keys(JOBS);
  const res=await Promise.allSettled(names.map(async n=>{
    await loadModel(n);
    bump(JOBS[n].msg,13);
  }));
  res.forEach((r,i)=>{
    if(r.status==='rejected'){
      dead[names[i]]=true;
      deadErr[names[i]]=(r.reason&&r.reason.name)||'load';
    }
  });
}

// ── ПЛАНУВАЛЬНИК: зважений round-robin по активних ────
const WEIGHTS={ face:2, gest:2, pose:1, seg:1, obj:1 };
const HAS={ face:()=>FL, gest:()=>GR, pose:()=>PL, seg:()=>SG, obj:()=>OD };
function rebuildQueue(){
  const items=Object.keys(layer).filter(k=>layer[k]&&HAS[k]()).map(k=>[k,WEIGHTS[k]]);
  const key=items.map(i=>i[0]).join(',');
  if(key!==queueKey){ queueKey=key; queue=items.length?buildQueue(items):[]; }
}

// ── ЦИКЛ ───────────────────────────────────────────────
const useRVFC='requestVideoFrameCallback' in HTMLVideoElement.prototype;
function schedule(){
  if(!running) return;
  if(useRVFC) vid.requestVideoFrameCallback(onFrame);
  else requestAnimationFrame(onFrame);
}
function onFrame(){
  const now=performance.now();
  if(vid.readyState>=2 && vid.videoWidth){
    frameNo++;
    rebuildQueue();
    if(queue.length){
      const w=queue[frameNo%queue.length];
      try{ dispatch(w,now); }catch(_){}
    }
    if(!mode3d) draw(now);
    const dt=(now-lastT)||1; lastT=now;
    fpsV = fpsV ? fpsV*0.9+(1000/dt)*0.1 : 1000/dt;
    if(now-lastFpsUpd>300){
      const f=Math.round(fpsV);
      fpsTxt=f+' fps';
      fpsCol = f<15?RED : f<24?AMBER : ACC_D;
      lastFpsUpd=now;
    }
  }
  schedule();
}
function dispatch(w,now){
  if(w==='face'){ faceRes=FL.detectForVideo(vid,now); postFace(now); }
  else if(w==='gest'){ gestRes=GR.recognizeForVideo(vid,now); postGest(now); }
  else if(w==='pose'){ poseRes=PL.detectForVideo(vid,now); }
  else if(w==='seg'){
    if(!segBusy){ segBusy=true; SG.send({ image:vid }).catch(()=>{ segBusy=false; }); }
  }
  else if(w==='obj'){
    if(!objBusy){
      objBusy=true;
      OD.detect(vid,8,0.3).then(ds=>{ objBusy=false; objRes=adaptCoco(ds); })
        .catch(()=>{ objBusy=false; });
    }
  }
}

// ── ПОСТ-ОБРОБКА: ЛИЦЕ (міміка, поза, ірис) ───────────
const ema=(o,v,k=0.3)=>o+(v-o)*k;
function bsMap(cats){ const m={}; for(const c of cats) m[c.categoryName]=c.score; return m; }
function postFace(now){
  const lms=faceRes&&faceRes.faceLandmarks;
  if(!lms||!lms.length){ hasPose=false; hasDist=false; gazeL=gazeR=null; faceBB=null; return; }
  // Блендшейпи -> 5 метрів
  const bsl=faceRes.faceBlendshapes;
  if(bsl&&bsl.length){
    const b=bsMap(bsl[0].categories);
    const g=n=>b[n]||0;
    meters.smile =ema(meters.smile ,(g('mouthSmileLeft')+g('mouthSmileRight'))/2);
    meters.brow  =ema(meters.brow  ,Math.max(g('browInnerUp'),(g('browOuterUpLeft')+g('browOuterUpRight'))/2));
    meters.squint=ema(meters.squint,(g('eyeSquintLeft')+g('eyeSquintRight'))/2);
    meters.jaw   =ema(meters.jaw   ,g('jawOpen'));
    const bl=(g('eyeBlinkLeft')+g('eyeBlinkRight'))/2;
    meters.blink =ema(meters.blink ,bl,0.5);
    if(!blinkClosed && bl>0.55){ blinkClosed=true; blinkCount++; closedAt=now; }
    else if(blinkClosed && bl<0.35) blinkClosed=false;
    eyesFor = blinkClosed ? (now-closedAt) : 0;
  }
  // Матриця -> компас
  const mats=faceRes.facialTransformationMatrixes;
  if(mats&&mats.length&&mats[0].data){
    const e=eulerFromMat(mats[0].data);
    yawS=ema(yawS,e.yaw); pitchS=ema(pitchS,e.pitch); rollS=ema(rollS,e.roll);
    hasPose=true;
  } else hasPose=false;
  // Ірис -> дистанція + погляд
  const lm=lms[0], vw=vid.videoWidth, vh=vid.videoHeight;
  { let a2=1,b2=0,c2=1,d2=0;
    for(const p of lm){ if(p.x<a2)a2=p.x; if(p.x>b2)b2=p.x; if(p.y<c2)c2=p.y; if(p.y>d2)d2=p.y; }
    faceBB={ minx:a2, maxx:b2, miny:c2, maxy:d2 }; }
  const eye=(eyeIdx,irisIdx)=>{
    let minx=1,maxx=0,miny=1,maxy=0;
    for(const i of eyeIdx){ const p=lm[i];
      if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x;
      if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
    let cx=0,cy=0;
    for(const i of irisIdx){ cx+=lm[i].x; cy+=lm[i].y; }
    cx/=irisIdx.length; cy/=irisIdx.length;
    let d=0;
    for(let a=0;a<irisIdx.length;a++) for(let b2=a+1;b2<irisIdx.length;b2++){
      const p=lm[irisIdx[a]], q=lm[irisIdx[b2]];
      const dx=(p.x-q.x)*vw, dy=(p.y-q.y)*vh;
      const dd=Math.hypot(dx,dy); if(dd>d)d=dd;
    }
    return { ex:(minx+maxx)/2, ey:(miny+maxy)/2, cx, cy, diam:d };
  };
  const R=eye(REYE_IDX,RIRIS_IDX), L=eye(LEYE_IDX,LIRIS_IDX);
  const diam=(R.diam+L.diam)/2;
  if(diam>2){
    const fpx=0.5*vw/Math.tan(Math.PI/6);        // ~60° HFOV, оцінка
    distS=ema(distS,fpx*1.17/diam,0.2); hasDist=true;
  } else hasDist=false;
  gazeR={ cx:R.cx, cy:R.cy, dx:R.cx-R.ex, dy:R.cy-R.ey };
  gazeL={ cx:L.cx, cy:L.cy, dx:L.cx-L.ex, dy:L.cy-L.ey };
  if(maskOn && maskImg && TRIS) renderWarp(lm,vw,vh);
  else warpBox=null;
}

// ── ПОСТ-ОБРОБКА: ЖЕСТИ (пінч-пензель, hold-дії) ──────
function postGest(now){
  const raw=gestRes&&gestRes.landmarks?gestRes.landmarks:[];
  handsOK=[]; gestsOK=[];
  for(let i=0;i<raw.length;i++){
    if(handPlausible(raw[i],faceBB)){
      handsOK.push(raw[i]);
      gestsOK.push(gestRes.gestures&&gestRes.gestures[i]?gestRes.gestures[i]:[]);
    }
  }
  const hands=handsOK;
  // Ролі за екраном: правіша рука = пензель, лівіша = ластик; одна = пензель
  let brushI=hands.length?0:-1, eraseI=-1;
  if(hands.length>=2){
    const sx=i=>{ const l=hands[i]; const v=(l[4].x+l[8].x)/2; return mirrored?1-v:v; };
    brushI = sx(0)>=sx(1) ? 0 : 1;
    eraseI = 1-brushI;
  }
  const roleIdx=[brushI,eraseI];
  for(let slot=0;slot<2;slot++){
    const s=pinch[slot], hi=roleIdx[slot];
    if(hi<0 || hi>=hands.length){ s.on=false; s.cnt=0; if(slot===0) s.cur=null; continue; }
    const lm=hands[hi];
    const tg=gestsOK[hi]&&gestsOK[hi][0];
    if(tg && tg.categoryName==='Closed_Fist' && tg.score>0.6){
      s.on=false; s.cnt=0; if(slot===0) s.cur=null; continue;
    }
    const scale=Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y)||1e-6;
    const r=Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y)/scale;
    const want = s.on ? r<0.45 : r<0.35;       // гістерезис
    if(want){
      s.cnt++;
      const px=(lm[4].x+lm[8].x)/2, py=(lm[4].y+lm[8].y)/2;
      const pz=((lm[4].z||0)+(lm[8].z||0))/2;
      if(s.cnt>=2){                             // дебаунс: 2 кадри поспіль
        if(slot===0){                           // пензель
          if(!s.on || !s.cur){ s.cur={pts:[{x:px,y:py,z:pz}]}; strokes.push(s.cur); }
          else{
            const pts=s.cur.pts, lp=pts[pts.length-1];
            if(Math.hypot(px-lp.x,py-lp.y)>0.006){
              pts.push({x:px,y:py,z:pz});
              while(strokeCount()>MAX_PTS && strokes.length>1) strokes.shift();
            }
          }
        }else{                                  // ластик з розрізанням
          strokes=eraseStrokes(strokes,px,py,0.06);
          if(pinch[0].cur && strokes.indexOf(pinch[0].cur)<0) pinch[0].cur=null;
        }
        s.on=true;
      }
    } else { s.on=false; s.cnt=0; if(slot===0) s.cur=null; }
  }
  // Захват кулаком у 3D: один — оберт, два — зум
  if(mode3d && !fly){
    const fists=[];
    for(let i=0;i<hands.length;i++){
      const g=gestsOK[i]&&gestsOK[i][0];
      if(g && g.categoryName==='Closed_Fist' && g.score>0.6){
        const lm2=hands[i];
        fists.push({ x:(lm2[0].x+lm2[5].x+lm2[17].x)/3, y:(lm2[0].y+lm2[5].y+lm2[17].y)/3 });
      }
    }
    if(fists.length===1){
      if(grabPrev && grabPrev.n===1){
        const fdx=fists[0].x-grabPrev.x, fdy=fists[0].y-grabPrev.y;
        orbit.th -= (mirrored?-fdx:fdx)*4.2;
        orbit.ph = Math.max(0.15,Math.min(3.0,orbit.ph+fdy*4.2));
        orbit.vth=orbit.vph=0;
      }
      grabPrev={ n:1, x:fists[0].x, y:fists[0].y };
    } else if(fists.length>=2){
      const d=Math.hypot(fists[0].x-fists[1].x, fists[0].y-fists[1].y);
      if(grabPrev && grabPrev.n===2 && grabPrev.d>0)
        orbit.r=Math.max(0.25,Math.min(8,orbit.r*grabPrev.d/d));
      grabPrev={ n:2, d };
    } else grabPrev=null;
  } else grabPrev=null;
  // Hold-жести: долоня 1.2с = стерти, victory 1.2с = 3D
  let top='';
  const gs=gestsOK;
  for(const g of gs){ if(g.length&&g[0].score>0.6){ top=g[0].categoryName; break; } }
  if(top==='Open_Palm'||top==='Victory'){
    if(holdName!==top){ holdName=top; holdSince=now; }
    else if(now-holdSince>1200 && now-lastFire>1800){
      lastFire=now;
      if(top==='Open_Palm'){ clearStrokes(); toast('Стерто. Як не було.'); }
      else setMode(!mode3d);
    }
  } else holdName='';
}

// ── ПОСТ-ОБРОБКА: СЕГМЕНТАЦІЯ ─────────────────────────
const mcv=document.createElement('canvas'), mcX=mcv.getContext('2d');
const segWork=document.createElement('canvas');
const segWx=segWork.getContext('2d',{ willReadFrequently:true });
function postSeg(res){
  try{
    const m=res&&res.segmentationMask;
    if(!m){ segCache=null; return; }
    const gw=96, gh=96;
    if(segWork.width!==gw||segWork.height!==gh){ segWork.width=gw; segWork.height=gh; }
    segWx.clearRect(0,0,gw,gh);
    segWx.drawImage(m,0,0,gw,gh);
    const raw=segWx.getImageData(0,0,gw,gh).data;
    let alphaVar=false;
    for(let i=0;i<gw*gh;i+=37){ if(raw[i*4+3]<250){ alphaVar=true; break; } }
    const grid=new Float32Array(gw*gh);
    for(let i=0;i<gw*gh;i++) grid[i]=alphaVar ? raw[i*4+3]/255 : raw[i*4]/255;
    if(mcv.width!==gw||mcv.height!==gh){ mcv.width=gw; mcv.height=gh; }
    const img=mcX.createImageData(gw,gh), px=img.data;
    for(let i=0;i<grid.length;i++){
      const o=i*4;
      px[o]=255; px[o+1]=255; px[o+2]=255; px[o+3]=(grid[i]*255)|0;
    }
    mcX.putImageData(img,0,0);
    segCache={ segs:marchingSquares(grid,gw,gh,0.5), gw, gh };
  }catch(_){ segCache=null; }
}

// ── МАСКА: жива проєкція фото на сітку ────────────────
let maskOn=false, maskImg=null, maskLms=null, FLI=null, TRIS=null, warpBox=null;
const warpCv=document.createElement('canvas'), warpX=warpCv.getContext('2d');
const warpGl=document.createElement('canvas');
let wgl=null, wglOK=false, wTex=null, wBuf=null, wUV=null, wPos=null, wN=0, wLocP=0, wLocT=0;
function initWGL(){
  try{
    wgl=warpGl.getContext('webgl',{ alpha:true, premultipliedAlpha:true, antialias:false });
    if(!wgl) return false;
    const mkSh=(t,src)=>{
      const x=wgl.createShader(t);
      wgl.shaderSource(x,src); wgl.compileShader(x);
      if(!wgl.getShaderParameter(x,wgl.COMPILE_STATUS)) throw 0;
      return x;
    };
    const pr=wgl.createProgram();
    wgl.attachShader(pr,mkSh(wgl.VERTEX_SHADER,
      'attribute vec2 aP;attribute vec2 aT;varying vec2 vT;void main(){vT=aT;gl_Position=vec4(aP,0.,1.);}'));
    wgl.attachShader(pr,mkSh(wgl.FRAGMENT_SHADER,
      'precision mediump float;varying vec2 vT;uniform sampler2D uS;void main(){gl_FragColor=texture2D(uS,vT);}'));
    wgl.linkProgram(pr);
    if(!wgl.getProgramParameter(pr,wgl.LINK_STATUS)) throw 0;
    wgl.useProgram(pr);
    wLocP=wgl.getAttribLocation(pr,'aP');
    wLocT=wgl.getAttribLocation(pr,'aT');
    wBuf=wgl.createBuffer(); wUV=wgl.createBuffer();
    wgl.enableVertexAttribArray(wLocP);
    wgl.enableVertexAttribArray(wLocT);
    wglOK=true;
    return true;
  }catch(_){ wglOK=false; wgl=null; return false; }
}
// Підготовка після завантаження фото: текстура + статичні UV
function wglPrep(){
  if(!wglOK && !initWGL()) return;
  if(wTex){ try{ wgl.deleteTexture(wTex); }catch(_){} }
  wTex=wgl.createTexture();
  wgl.bindTexture(wgl.TEXTURE_2D,wTex);
  wgl.texImage2D(wgl.TEXTURE_2D,0,wgl.RGBA,wgl.RGBA,wgl.UNSIGNED_BYTE,maskImg);
  wgl.texParameteri(wgl.TEXTURE_2D,wgl.TEXTURE_MIN_FILTER,wgl.LINEAR);
  wgl.texParameteri(wgl.TEXTURE_2D,wgl.TEXTURE_MAG_FILTER,wgl.LINEAR);
  wgl.texParameteri(wgl.TEXTURE_2D,wgl.TEXTURE_WRAP_S,wgl.CLAMP_TO_EDGE);
  wgl.texParameteri(wgl.TEXTURE_2D,wgl.TEXTURE_WRAP_T,wgl.CLAMP_TO_EDGE);
  wN=TRIS.length;
  const uv=new Float32Array(wN*2);
  for(let i=0;i<wN;i++){
    const p=maskLms[TRIS[i]];
    uv[i*2]=p.x; uv[i*2+1]=p.y;
  }
  wgl.bindBuffer(wgl.ARRAY_BUFFER,wUV);
  wgl.bufferData(wgl.ARRAY_BUFFER,uv,wgl.STATIC_DRAW);
  wPos=new Float32Array(wN*2);
  wgl.bindBuffer(wgl.ARRAY_BUFFER,wBuf);
  wgl.bufferData(wgl.ARRAY_BUFFER,wPos,wgl.DYNAMIC_DRAW);
}

function renderWarp(lm,vw,vh){
  let mnx=1,mny=1,mxx=0,mxy=0;
  for(const p of lm){
    if(p.x<mnx)mnx=p.x; if(p.x>mxx)mxx=p.x;
    if(p.y<mny)mny=p.y; if(p.y>mxy)mxy=p.y;
  }
  const pad=0.06;
  const bx=Math.max(0,(mnx-pad)*vw), by=Math.max(0,(mny-pad)*vh);
  const bw=Math.min(vw,(mxx+pad)*vw)-bx, bh=Math.min(vh,(mxy+pad)*vh)-by;
  if(bw<8||bh<8){ warpBox=null; return; }
  const S=Math.min(1.6, 640/Math.max(bw,bh));
  const W3=Math.max(2,Math.round(bw*S)), H3=Math.max(2,Math.round(bh*S));
  // Швидкий шлях: WebGL — вся сітка одним draw call, без швів
  if((wglOK||initWGL()) && wTex && wPos){
    if(warpGl.width!==W3||warpGl.height!==H3){
      warpGl.width=W3; warpGl.height=H3;
    }
    wgl.viewport(0,0,W3,H3);
    wgl.clearColor(0,0,0,0);
    wgl.clear(wgl.COLOR_BUFFER_BIT);
    for(let i=0;i<wN;i++){
      const p=lm[TRIS[i]];
      wPos[i*2]  =((p.x*vw-bx)*S)/W3*2-1;
      wPos[i*2+1]=1-((p.y*vh-by)*S)/H3*2;
    }
    wgl.bindBuffer(wgl.ARRAY_BUFFER,wBuf);
    wgl.bufferSubData(wgl.ARRAY_BUFFER,0,wPos);
    wgl.vertexAttribPointer(wLocP,2,wgl.FLOAT,false,0,0);
    wgl.bindBuffer(wgl.ARRAY_BUFFER,wUV);
    wgl.vertexAttribPointer(wLocT,2,wgl.FLOAT,false,0,0);
    wgl.drawArrays(wgl.TRIANGLES,0,wN);
    warpBox={ bx,by,bw,bh, src:warpGl };
    return;
  }
  // Фолбек: 2D-канвас потрикутниково
  if(warpCv.width!==W3||warpCv.height!==H3){ warpCv.width=W3; warpCv.height=H3; }
  warpX.clearRect(0,0,W3,H3);
  const iw=maskImg.width, ih=maskImg.height, sl=maskLms, EX=1.03;
  for(let t=0;t<TRIS.length;t+=3){
    const i0=TRIS[t], i1=TRIS[t+1], i2=TRIS[t+2];
    let dx0=(lm[i0].x*vw-bx)*S, dy0=(lm[i0].y*vh-by)*S;
    let dx1=(lm[i1].x*vw-bx)*S, dy1=(lm[i1].y*vh-by)*S;
    let dx2=(lm[i2].x*vw-bx)*S, dy2=(lm[i2].y*vh-by)*S;
    const cx3=(dx0+dx1+dx2)/3, cy3=(dy0+dy1+dy2)/3;
    dx0=cx3+(dx0-cx3)*EX; dy0=cy3+(dy0-cy3)*EX;
    dx1=cx3+(dx1-cx3)*EX; dy1=cy3+(dy1-cy3)*EX;
    dx2=cx3+(dx2-cx3)*EX; dy2=cy3+(dy2-cy3)*EX;
    const M=affineOf(
      [sl[i0].x*iw,sl[i0].y*ih, sl[i1].x*iw,sl[i1].y*ih, sl[i2].x*iw,sl[i2].y*ih],
      [dx0,dy0, dx1,dy1, dx2,dy2]);
    if(!M) continue;
    warpX.save();
    warpX.beginPath();
    warpX.moveTo(dx0,dy0); warpX.lineTo(dx1,dy1); warpX.lineTo(dx2,dy2);
    warpX.closePath(); warpX.clip();
    warpX.setTransform(M[0],M[1],M[2],M[3],M[4],M[5]);
    warpX.drawImage(maskImg,0,0);
    warpX.restore();
  }
  warpBox={ bx,by,bw,bh, src:warpCv };
}

const UA={"person":"ЛЮДИНА","cell phone":"ТЕЛЕФОН","bottle":"ПЛЯШКА","cup":"ЧАШКА",
"laptop":"НОУТБУК","keyboard":"КЛАВІАТУРА","mouse":"МИША","tv":"ЕКРАН","book":"КНИГА",
"chair":"СТІЛЕЦЬ","couch":"ДИВАН","bed":"ЛІЖКО","dining table":"СТІЛ","remote":"ПУЛЬТ",

// ── 2D РЕНДЕР ──────────────────────────────────────────
function strokeConn(lm,conns,color,w,ox,oy,dw,dh){
  ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath();
  for(let i=0;i<conns.length;i++){
    const c=conns[i], a=lm[c.start], b=lm[c.end];
    ctx.moveTo(ox+a.x*dw, oy+a.y*dh);
    ctx.lineTo(ox+b.x*dw, oy+b.y*dh);
  }
  ctx.stroke();
}
function dots(lm,color,r,ox,oy,dw,dh){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(const p of lm){
    const x=ox+p.x*dw, y=oy+p.y*dh;
    ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832);
  }
  ctx.fill();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw||!vh) return;
  const { s,dw,dh,ox,oy }=coverMap(vw,vh,W,H);

  ctx.save();
  if(mirrored){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.lineCap='round'; ctx.lineJoin='round';

  // 1. Сегментація: глушимо фон, світлимо людину, неон-контур
  if(layer.seg && segCache){
    if(cfg.dim){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='destination-out';
    ctx.drawImage(mcv,ox,oy,dw,dh);              // виріз по масці
    ctx.globalCompositeOperation='source-over';
    // людина: сире відео (без CSS-фільтра) крізь маску, пригашене до ~55%
    pcX.setTransform(1,0,0,1,0,0);
    pcX.clearRect(0,0,pcv.width,pcv.height);
    const k=pcv.width/W;
    pcX.drawImage(vid,ox*k,oy*k,dw*k,dh*k);
    pcX.globalCompositeOperation='destination-in';
    pcX.drawImage(mcv,ox*k,oy*k,dw*k,dh*k);
    pcX.globalCompositeOperation='source-atop';
    pcX.fillStyle='rgba(0,4,2,0.45)';
    pcX.fillRect(0,0,pcv.width,pcv.height);
    pcX.globalCompositeOperation='source-over';
    ctx.drawImage(pcv,0,0,W,H);
    }
    // контур
    if(cfg.edge){
    const sc=segCache, kx=dw/(sc.gw-1), ky=dh/(sc.gh-1);
    ctx.strokeStyle=ACC; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<sc.segs.length;i+=4){
      ctx.moveTo(ox+sc.segs[i]*kx,   oy+sc.segs[i+1]*ky);
      ctx.lineTo(ox+sc.segs[i+2]*kx, oy+sc.segs[i+3]*ky);
    }
    ctx.stroke();
    }
  }

  // МАСКА: фото, натягнуте на живу сітку
  if(maskOn && warpBox && faceRes && faceRes.faceLandmarks && faceRes.faceLandmarks.length){
    ctx.globalAlpha=cfg.mo;
    ctx.drawImage(warpBox.src, ox+warpBox.bx*s, oy+warpBox.by*s, warpBox.bw*s, warpBox.bh*s);
    ctx.globalAlpha=1;
  }

  // 2. Поза
  if(layer.pose && poseRes && poseRes.landmarks){
    for(const lm of poseRes.landmarks){
      strokeConn(lm,PCONN,'rgba(198,245,66,.45)',2,ox,oy,dw,dh);
      dots(lm,'rgba(198,245,66,.6)',2.5,ox,oy,dw,dh);
    }
  }

  // 3. Лице
  if(layer.face && faceRes && faceRes.faceLandmarks){
    for(const lm of faceRes.faceLandmarks){
      if(cfg.tessOn) strokeConn(lm,TESS,'rgba(198,245,66,'+cfg.ta+')',0.6,ox,oy,dw,dh);
      strokeConn(lm,REYE,ACC,1.5*cfg.lw,ox,oy,dw,dh);
      strokeConn(lm,LEYE,ACC,1.5*cfg.lw,ox,oy,dw,dh);
      strokeConn(lm,INNER_LIPS,ACC,1.5*cfg.lw,ox,oy,dw,dh);
    }
  }

  // 4. Руки (з GestureRecognizer)
  if(layer.gest && handsOK.length){
    for(const lm of handsOK){
      strokeConn(lm,HCONN,ACC,2*cfg.lw,ox,oy,dw,dh);
      dots(lm,WHT,3,ox,oy,dw,dh);
    }
  }
  // Штрихи air-draw (вектор, простір кадру)
  if(strokes.length){
    for(const pass of [[8,'rgba(255,255,255,.25)'],[3,'#FFFFFF']]){
      ctx.lineWidth=pass[0]; ctx.strokeStyle=pass[1];
      ctx.beginPath();
      for(const q of strokes){
        const pts=q.pts;
        if(pts.length<2) continue;
        ctx.moveTo(ox+pts[0].x*dw, oy+pts[0].y*dh);
        for(let i=1;i<pts.length;i++) ctx.lineTo(ox+pts[i].x*dw, oy+pts[i].y*dh);
      }
      ctx.stroke();
    }
  }
  ctx.restore();

  // ── далі екранний простір (без дзеркала) ──

  // 5. Об'єкти: рамки-кутники + укр лейбли
  if(layer.obj && objRes && objRes.detections){
    ctx.lineWidth=1.5; ctx.font=`13px ${FONT}`; ctx.textAlign='left';
    for(const d of objRes.detections){
      const bb=d.boundingBox; if(!bb) continue;
      const c0=d.categories&&d.categories[0]; if(!c0) continue;
      if(c0.score<cfg.thr) continue;
      let x=ox+bb.originX*s;
      const y=oy+bb.originY*s, w=bb.width*s, h=bb.height*s;
      if(mirrored) x=W-(x+w);
      const cl=Math.min(14,w*0.3,h*0.3);
      ctx.strokeStyle=ACC;
      ctx.beginPath();
      [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([qx,qy,sx,sy])=>{
        ctx.moveTo(qx+sx*cl,qy); ctx.lineTo(qx,qy); ctx.lineTo(qx,qy+sy*cl);
      });
      ctx.stroke();
      const name=UA[c0.categoryName]||(c0.categoryName||'').toUpperCase();
      const label=`${name} ${Math.round(c0.score*100)}`;
      const tw=ctx.measureText(label).width;
      ctx.fillStyle='rgba(25,25,27,.9)';
      ctx.fillRect(x,y-18,tw+10,16);
      ctx.fillStyle=WHT;
      ctx.fillText(label,x+5,y-6);
    }
  }

  // 6. Погляд з очей
  if(cfg.gaze && layer.face && gazeL && gazeR){
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.5;
    for(const g of [gazeL,gazeR]){
      let x=ox+g.cx*dw; const y=oy+g.cy*dh;
      let dx=g.dx*dw; const dy=g.dy*dh;
      if(mirrored){ x=W-x; dx=-dx; }
      const m=Math.hypot(dx,dy)||1e-6;
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+dx/m*30, y+dy/m*30);
      ctx.stroke();
    }
  }

  // 7. HUD: бари міміки (зліва)
  if(layer.face && faceRes && faceRes.faceLandmarks && faceRes.faceLandmarks.length){
    if(cfg.bars){
    const rows=[['УСМІХ',meters.smile],['БРОВИ',meters.brow],['ПРИЖМ',meters.squint],
                ['РОТ',meters.jaw],['КЛІП',meters.blink]];
    let y=56;
    ctx.font=`11px ${FONT}`; ctx.textAlign='left';
    for(const [lb,v] of rows){
      ctx.fillStyle=ACC_D; ctx.fillText(lb,12,y-3);
      ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(12,y,88,4);
      ctx.fillStyle=v>0.6?WHT:ACC; ctx.fillRect(12,y,88*Math.min(1,v),4);
      y+=24;
    }
    ctx.fillStyle=ACC_D; ctx.fillText(`КЛІПАНЬ: ${blinkCount}`,12,y+2);
    if(eyesFor>600){
      const lbl='ОЧІ ЗАКРИТІ · '+(eyesFor/1000).toFixed(1)+'с';
      ctx.font=`11px ${FONT}`;
      const tw2=ctx.measureText(lbl).width;
      ctx.fillStyle='rgba(25,25,27,.9)';
      ctx.fillRect(12,y+10,tw2+16,22);
      ctx.fillStyle=WHT;
      ctx.fillText(lbl,20,y+25);
    }
    }

    // 8. Компас голови (справа)
    if(cfg.poseHud && hasPose){
      const cx=W-46, cy=64, r=25;
      ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.stroke();
      for(let a=0;a<12;a++){
        const t=a*Math.PI/6;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(t)*(r-3),cy+Math.sin(t)*(r-3));
        ctx.lineTo(cx+Math.cos(t)*r,cy+Math.sin(t)*r);
        ctx.stroke();
      }
      ctx.save();                                 // штучний горизонт: roll+pitch
      ctx.translate(cx,cy); ctx.rotate(rollS);
      const po=Math.max(-18,Math.min(18,pitchS*40));
      ctx.strokeStyle=WHT; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-r+6,po); ctx.lineTo(r-6,po); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle=ACC; ctx.lineWidth=1.5;   // yaw-стрілка
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.sin(yawS)*(r-6), cy-Math.cos(yawS)*(r-6));
      ctx.stroke();
      const dg=v=>{ const d=Math.round(v*180/Math.PI); return (d>=0?'+':'')+d; };
      ctx.font=`10px ${FONT}`; ctx.textAlign='right'; ctx.fillStyle=ACC_D;
      ctx.fillText('ПОЗА ГОЛОВИ',W-12,cy-r-8);
      ctx.font=`11px ${FONT}`;
      ctx.fillText(`Y${dg(yawS)} P${dg(pitchS)} R${dg(rollS)}`,W-12,cy+r+12);
      if(hasDist){
        ctx.fillStyle=ACC; ctx.font=`13px ${FONT}`;
        ctx.fillText(`ДИСТ ~${Math.round(distS)} СМ`,W-12,cy+r+27);
      }
    }
  }

  // 9. FPS у куті канваса
  ctx.font=`14px ${FONT}`; ctx.textAlign='left';
  ctx.fillStyle='rgba(11,11,12,.6)';
  ctx.fillRect(8,8,66,18);
  ctx.fillStyle=fpsCol;
  ctx.fillText(fpsTxt,12,22);
}

// ── 3D РЕЖИМ ───────────────────────────────────────────
let THREE=null, scene=null, geo3={};
const orbit={ th:0, ph:1.15, r:1.9, vth:0, vph:0 };
const c3=[0,0,0]; let s3=1;                        // фіт: центр + масштаб
let grid3=null, selMesh=null;                      // сітка-підлога, маркер піка
let fly=false, flyPos=null, flyYaw=0, flyPitch=0;
let joyId=-1, joyOx=0, joyOy=0, joyVx=0, joyVy=0, lookId=-1;
let orbN=0, t3last=0;
let v3a=null, v3b=null, eulT=null;
const joyEl=$('joy'), knob=$('knob');
function showJoy(x,y){ joyEl.style.left=x+'px'; joyEl.style.top=y+'px'; joyEl.style.display='block'; }
function hideJoy(){ joyEl.style.display='none'; knob.style.transform='translate(-50%,-50%)'; }
function applyPt(pulse=1){
  if(!THREE) return;
  geo3.faceP.material.size=0.013*cfg.pt*pulse;
  geo3.handP.material.size=0.02*cfg.pt*pulse;
  geo3.poseP.material.size=0.022*cfg.pt*pulse;
}

async function init3D(){
  THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  renderer=new THREE.WebGLRenderer({ canvas:glc, antialias:false });
  renderer.setPixelRatio(DPR);
  renderer.setSize(W,H,false);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0B0B0C);
  cam3=new THREE.PerspectiveCamera(50,W/H,0.01,50);
  cam3.rotation.order='YXZ';
  v3a=new THREE.Vector3(); v3b=new THREE.Vector3(); eulT=new THREE.Euler(0,0,0,'YXZ');
  grid3=new THREE.GridHelper(3,12,0x232326,0x232326);
  grid3.translateY(-0.9); grid3.visible=cfg.grid;
  scene.add(grid3);
  const mkLines=(n,color,op)=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
    const o=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
    o.frustumCulled=false; scene.add(o); return o;
  };
  const mkPts=(n,color,size,op)=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
    const o=new THREE.Points(g,new THREE.PointsMaterial({color,size,transparent:true,opacity:op}));
    o.frustumCulled=false; scene.add(o); return o;
  };
  geo3.faceL=mkLines(TESS.length*2,0xC6F542,0.3);
  geo3.faceP=mkPts(478,0xC6F542,0.013,0.9);
  geo3.handL=mkLines(HCONN.length*2*2,0xC6F542,0.9);
  geo3.handP=mkPts(42,0xFFFFFF,0.02,0.95);
  geo3.poseL=mkLines(PCONN.length*2,0xC6F542,0.45);
  geo3.poseP=mkPts(33,0xC6F542,0.022,0.6);
  geo3.inkL=mkLines(16384,0xFFFFFF,0.95);
  selMesh=new THREE.Mesh(
    new THREE.SphereGeometry(1,14,10),
    new THREE.MeshBasicMaterial({ color:0xC6F542, wireframe:true, transparent:true, opacity:0.25 }));
  selMesh.visible=false;
  scene.add(selMesh);
  applyPt();
  // Вказівники: орбіта (драг+щипок+інерція) / політ (джойстик+огляд)
  const ptr=new Map(), downs=new Map();
  let pd=0, lastTap=0, lastTapX=0, lastTapY=0;
  glc.addEventListener('pointerdown',e=>{
    if(openPane) setPane(null);
    glc.setPointerCapture(e.pointerId);
    downs.set(e.pointerId,{t:performance.now(),x:e.clientX,y:e.clientY});
    if(fly){
      if(e.clientX<W/2 && joyId<0){
        joyId=e.pointerId; joyOx=e.clientX; joyOy=e.clientY;
        joyVx=joyVy=0; showJoy(e.clientX,e.clientY);
      } else if(lookId<0){
        lookId=e.pointerId; ptr.set(e.pointerId,[e.clientX,e.clientY]);
      }
    } else {
      ptr.set(e.pointerId,[e.clientX,e.clientY]); orbN=ptr.size;
      orbit.vth=orbit.vph=0;
    }
  });
  glc.addEventListener('pointermove',e=>{
    if(fly){
      if(e.pointerId===joyId){
        let dx=e.clientX-joyOx, dy=e.clientY-joyOy;
        const ml=Math.hypot(dx,dy), mx=44;
        if(ml>mx){ dx=dx/ml*mx; dy=dy/ml*mx; }
        joyVx=dx/mx; joyVy=dy/mx;
        knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      } else if(e.pointerId===lookId && ptr.has(e.pointerId)){
        const pv=ptr.get(e.pointerId);
        ptr.set(e.pointerId,[e.clientX,e.clientY]);
        flyYaw-=(e.clientX-pv[0])*0.004;
        flyPitch=Math.max(-1.45,Math.min(1.45,flyPitch-(e.clientY-pv[1])*0.004));
      }
      return;
    }
    if(!ptr.has(e.pointerId)) return;
    const pv=ptr.get(e.pointerId);
    ptr.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptr.size===1){
      const dx=e.clientX-pv[0], dy=e.clientY-pv[1];
      if(openPane==='p-edit' && curTweak){
        curTweak.o[edAxis]+=(edAxis===1 ? -dy : dx)*0.004;
        orbit.vth=orbit.vph=0;
      } else {
        orbit.th-=dx*0.006;
        orbit.ph=Math.max(0.15,Math.min(3.0,orbit.ph-dy*0.006));
        orbit.vth=-dx*0.006; orbit.vph=-dy*0.006;
      }
    }else if(ptr.size===2){
      const ps=[...ptr.values()];
      const nd=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);
      if(pd>0) orbit.r=Math.max(0.25,Math.min(8,orbit.r*pd/nd));
      pd=nd;
    }
  });
  const up=e=>{
    const d=downs.get(e.pointerId); downs.delete(e.pointerId);
    if(d && performance.now()-d.t<250 && Math.hypot(e.clientX-d.x,e.clientY-d.y)<12){
      if(openPane==='p-edit' && mode3d && !fly){
        edPick(e.clientX,e.clientY);
        lastTap=0;
      } else {
        const tn=performance.now();
        if(tn-lastTap<330 && Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<40){ resetCam(); lastTap=0; }
        else { lastTap=tn; lastTapX=e.clientX; lastTapY=e.clientY; }
      }
    }
    if(e.pointerId===joyId){ joyId=-1; joyVx=joyVy=0; hideJoy(); }
    if(e.pointerId===lookId) lookId=-1;
    ptr.delete(e.pointerId);
    if(ptr.size<2) pd=0;
    orbN=ptr.size;
  };
  glc.addEventListener('pointerup',up);
  glc.addEventListener('pointercancel',up);
}
function resetCam(){
  if(fly) setFly(false,true);
  orbit.th=0; orbit.ph=1.15; orbit.r=1.9; orbit.vth=orbit.vph=0;
  toast('Камера скинута.');
}
function setFly(on,silent){
  fly=on;
  const b=$('b-dive');
  b.querySelector('span').textContent=on?'Виринути':'Пірнути';
  b.classList.toggle('on',on);
  if(on){
    flyPos=cam3.position.clone();
    cam3.lookAt(0,0,0);
    flyYaw=cam3.rotation.y; flyPitch=cam3.rotation.x;
    gyroPrev=null;
    if(!silent) toast('Пірнув. Ліво — хід, право — огляд.');
  }else{
    joyId=-1; lookId=-1; joyVx=joyVy=0; hideJoy();
    const p=cam3.position, r=Math.max(0.25,p.length());
    orbit.r=Math.min(8,r);
    orbit.ph=Math.acos(Math.max(-1,Math.min(1,p.y/r)));
    orbit.th=Math.atan2(p.x,p.z);
    orbit.vth=orbit.vph=0;
    if(!silent) toast('Винирнув.');
  }
}
function map3(p,a,out,o){
  const m=mapPt(p,a,mirrored);
  let x=(m[0]-c3[0])*s3, y=(m[1]-c3[1])*s3, z=(m[2]-c3[2])*s3;
  for(const t of tweaks){
    const dx=x-t.c[0], dy=y-t.c[1], dz=z-t.c[2];
    const w=falloff2(dx*dx+dy*dy+dz*dz,t.r);
    if(w>0){ x+=t.o[0]*w; y+=t.o[1]*w; z+=t.o[2]*w; }
  }
  out[o]=x; out[o+1]=y; out[o+2]=z;
}
function fillLines(obj,lm,conns,a){
  const arr=obj.geometry.attributes.position.array;
  let o=0;
  for(const c of conns){ map3(lm[c.start],a,arr,o); o+=3; map3(lm[c.end],a,arr,o); o+=3; }
  obj.geometry.setDrawRange(0,o/3);
  obj.geometry.attributes.position.needsUpdate=true;
  obj.visible=true;
}
function fillPts(obj,lms,a){
  const arr=obj.geometry.attributes.position.array;
  let o=0;
  for(const lm of lms) for(const p of lm){ map3(p,a,arr,o); o+=3; }
  obj.geometry.setDrawRange(0,o/3);
  obj.geometry.attributes.position.needsUpdate=true;
  obj.visible=o>0;
}
function upd3(dt){
  const a=(vid.videoWidth||640)/(vid.videoHeight||480);
  const fl=layer.face&&faceRes&&faceRes.faceLandmarks&&faceRes.faceLandmarks.length?faceRes.faceLandmarks:null;
  const hl=layer.gest&&handsOK.length?handsOK:null;
  const pl=layer.pose&&poseRes&&poseRes.landmarks&&poseRes.landmarks.length?poseRes.landmarks:null;
  // Авто-фіт: якір — лице; фолбек — все видиме. Рука лице більше не рухає.
  {
    const flat=[];
    const push=ls=>{ for(const lm of ls) for(const p of lm){ const m=mapPt(p,a,mirrored); flat.push(m[0],m[1],m[2]); } };
    if(fl) push([fl[0]]);
    else { if(hl) push(hl); if(pl) push([pl[0]]); }
    const bb=bboxOf(flat);
    if(bb){
      const f=fitFromBbox(bb.mn,bb.mx,0.55), k=0.2;
      c3[0]+=(f.c[0]-c3[0])*k; c3[1]+=(f.c[1]-c3[1])*k; c3[2]+=(f.c[2]-c3[2])*k;
      s3+=(f.s-s3)*k;
    }
  }
  {
  if(fl){ fillLines(geo3.faceL,fl[0],TESS,a); fillPts(geo3.faceP,[fl[0]],a); }
  else geo3.faceL.visible=geo3.faceP.visible=false;
  if(hl){
    const arr=geo3.handL.geometry.attributes.position.array;
    let o=0;
    for(const lm of hl) for(const c of HCONN){ map3(lm[c.start],a,arr,o); o+=3; map3(lm[c.end],a,arr,o); o+=3; }
    geo3.handL.geometry.setDrawRange(0,o/3);
    geo3.handL.geometry.attributes.position.needsUpdate=true;
    geo3.handL.visible=true;
    fillPts(geo3.handP,hl,a);
  } else geo3.handL.visible=geo3.handP.visible=false;
  if(pl){ fillLines(geo3.poseL,pl[0],PCONN,a); fillPts(geo3.poseP,[pl[0]],a); }
  else geo3.poseL.visible=geo3.poseP.visible=false;
  if(strokes.length){
    const arr=geo3.inkL.geometry.attributes.position.array;
    const cap=arr.length-6;
    let o=0;
    for(const q of strokes){
      const pts=q.pts;
      for(let i=0;i+1<pts.length && o<=cap;i++){
        map3(pts[i],a,arr,o); o+=3;
        map3(pts[i+1],a,arr,o); o+=3;
      }
    }
    geo3.inkL.geometry.setDrawRange(0,o/3);
    geo3.inkL.geometry.attributes.position.needsUpdate=true;
    geo3.inkL.visible=o>0;
  } else geo3.inkL.visible=false;
  }
  if(fly){
    eulT.set(flyPitch,flyYaw,0,'YXZ');
    v3a.set(0,0,-1).applyEuler(eulT);
    v3b.set(1,0,0).applyEuler(eulT);
    flyPos.addScaledVector(v3a,-joyVy*cfg.fs*dt);
    flyPos.addScaledVector(v3b, joyVx*cfg.fs*dt);
    cam3.position.copy(flyPos);
    cam3.rotation.set(flyPitch,flyYaw,0);
  }else{
    if(orbN===0){                                  // інерція вибігу
      orbit.th+=orbit.vth;
      orbit.ph=Math.max(0.15,Math.min(3.0,orbit.ph+orbit.vph));
      orbit.vth*=0.93; orbit.vph*=0.93;
      if(Math.abs(orbit.vth)<1e-4) orbit.vth=0;
      if(Math.abs(orbit.vph)<1e-4) orbit.vph=0;
    }
    cam3.position.set(
      orbit.r*Math.sin(orbit.ph)*Math.sin(orbit.th),
      orbit.r*Math.cos(orbit.ph),
      orbit.r*Math.sin(orbit.ph)*Math.cos(orbit.th));
    cam3.lookAt(0,0,0);
  }
}

  if(fl) ents.push({ lms:[fl[0]], conns:TESS,  color:[0.416,0.835,0.510] });

// Пік: проєкція всіх видимих точок камерою, найближча в 40px
function edPick(px,py){
  if(!THREE||!cam3) return;
  const a=(vid.videoWidth||640)/(vid.videoHeight||480);
  const cands=[];
  const addLm=ls=>{
    for(const lm of ls) for(const p of lm){
      const m=mapPt(p,a,mirrored);
      cands.push((m[0]-c3[0])*s3,(m[1]-c3[1])*s3,(m[2]-c3[2])*s3);
    }
  };
  const fl=layer.face&&faceRes&&faceRes.faceLandmarks&&faceRes.faceLandmarks.length?faceRes.faceLandmarks:null;
  const hl=layer.gest&&handsOK.length?handsOK:null;
  const pl=layer.pose&&poseRes&&poseRes.landmarks&&poseRes.landmarks.length?poseRes.landmarks:null;
  if(fl) addLm([fl[0]]);
  if(hl) addLm(hl);
  if(pl) addLm([pl[0]]);
  if(!cands.length){ edStat('Хмара порожня — нема що пікати.'); return; }
  const v=new THREE.Vector3();
  let best=-1, bd=1600, bx=0, byy=0, bz=0;
  for(let i=0;i<cands.length;i+=3){
    let x=cands[i], y=cands[i+1], z=cands[i+2];
    for(const t of tweaks){
      const dx=x-t.c[0], dy=y-t.c[1], dz=z-t.c[2];
      const w=falloff2(dx*dx+dy*dy+dz*dz,t.r);
      if(w>0){ x+=t.o[0]*w; y+=t.o[1]*w; z+=t.o[2]*w; }
    }
    v.set(x,y,z).project(cam3);
    const sx=(v.x*0.5+0.5)*W, sy=(0.5-v.y*0.5)*H;
    const dd=(sx-px)*(sx-px)+(sy-py)*(sy-py);
    if(dd<bd){ bd=dd; best=i; bx=x; byy=y; bz=z; }
  }
  if(best<0){ edStat('Поряд точки нема — тапни ближче.'); return; }
  curTweak={ c:[bx,byy,bz], r:edRadius, o:[0,0,0] };
  tweaks.push(curTweak);
  if(tweaks.length>24) tweaks.shift();
  if(selMesh){
    selMesh.position.set(bx,byy,bz);
    selMesh.scale.setScalar(edRadius);
    selMesh.visible=true;
  }
  edStat('Точка вибрана — тягни пальцем (вісь '+'XYZ'[edAxis]+').');
}

const eqc=$('eq'), eqx=eqc.getContext('2d');
function eqLoop(){
  if(!micOn) return;
  requestAnimationFrame(eqLoop);
  const N=analy.frequencyBinCount;
  const buf=new Uint8Array(N);
  analy.getByteFrequencyData(buf);
  const W2=eqc.width, H2=eqc.height, bars=24, step=Math.floor(N/bars)||1;
  let sum=0;
  eqx.clearRect(0,0,W2,H2);
  eqx.fillStyle=ACC;
  for(let i=0;i<bars;i++){
    let v=0;
    for(let j=0;j<step;j++) v=Math.max(v,buf[i*step+j]||0);
    sum+=v;
    const bh=Math.max(2,(v/255)*H2);
    eqx.fillRect(i*(W2/bars)+1, H2-bh, (W2/bars)-2, bh);
  }
  micLevel += ((sum/bars/255)-micLevel)*0.25;
}
function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Розпізнавання мови тут не водиться. EQ працює.'); return; }
  rec=new SR();
  rec.lang=cfg.lang; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let fin='', intm='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) fin+=r[0].transcript;
      else intm+=r[0].transcript;
    }
    if(fin){
      finText=(finText+' '+fin).trim().split(/\s+/).slice(-24).join(' ');
      sfin.textContent=finText+' ';
      steno.push({ ts:clk(), text:fin.trim() });
      if(openPane==='p-voice') renderSteno();
    }
    sint.textContent=intm;
  };
  rec.onend=()=>{ if(recWant) setTimeout(()=>{ try{ rec.start(); }catch(_){} },250); };
  rec.onerror=()=>{};
  try{ rec.start(); }catch(_){}
}

function wrapText(g,text,maxW){
  const words=text.split(/\s+/), out=[];
  let line='';
  for(const w of words){
    const t=line?line+' '+w:w;
    if(g.measureText(t).width>maxW && line){ out.push(line); line=w; }
    else line=t;
  }
  if(line) out.push(line);
  return out;
}
function stenoPdf(){

    for(const l of wrapText(g,'['+s.ts+']  '+s.text,PW-2*M2)) lines.push(l);
  const np=Math.max(1,Math.ceil(lines.length/per));
  const pages=[];
  for(let p=0;p<np;p++){

    g.font='28px '+FONT; g.fillStyle='#111';
    for(let i=0;i<per;i++){
      const l=lines[p*per+i];
      if(l==null) break;
      g.fillText(l,M2,top+i*LH);
    }
    const bin=atob(cnv.toDataURL('image/jpeg',0.92).split(',')[1]);
    const u=new Uint8Array(bin.length);
    for(let i2=0;i2<bin.length;i2++) u[i2]=bin.charCodeAt(i2);
    pages.push({ jpeg:u, w:PW, h:PH });
  }
  dl(`mydash_steno_${stamp()}.pdf`,writePDF(pages),'application/pdf');
  toast('PDF: '+np+' стор.');
}
let gyroOK=false, gyroPrev=null;
async function initGyro(){
  try{
    if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted') return;
    }
    window.addEventListener('deviceorientation',e=>{
      if(e.alpha==null) return;
      if(gyroPrev && fly && mode3d){
        let da=e.alpha-gyroPrev.a;
        if(da>180) da-=360; else if(da<-180) da+=360;
        const db=e.beta-gyroPrev.b;
        flyYaw += da*Math.PI/180;
        flyPitch = Math.max(-1.45,Math.min(1.45, flyPitch + db*Math.PI/180*0.8));
      }
      gyroPrev={ a:e.alpha, b:e.beta };
    });
    gyroOK=true;
  }catch(_){}
}

// ── BOOT ───────────────────────────────────────────────
(async ()=>{
  try{
    st('Тягну нейронки з CDN…',5);
    const vp=initVision();
    vp.catch(()=>{});
    st('Моделі їдуть фоном. Тисни СТАРТ.',10);
    const lstart=$('lstart');
    lstart.hidden=false;
    await new Promise(res=>lstart.addEventListener('click',res,{ once:true }));
    lstart.hidden=true;
    st('Дай добро на камеру, ша…',15);
    try{ await startCam(facing); }
    catch(e){ throw { kind:'cam', e }; }
    applyMirror();
    st('Тепер мікрофон…',22);
    try{ await setMic(true); }catch(_){}
    st('І гіроскоп…',26);
    await initGyro();
    st('Камера є. Мізки ще їдуть…',30);
    try{ await vp; }
    catch(e){ throw { kind:'cdn', e }; }
    if(!FL&&!GR) throw { kind:'cdn', e:new Error('core') };
    st('Прогріваю делегатів…',95);
    try{
      let t=performance.now();
      if(vid.readyState>=2){
        for(const m of [FL,GR,PL]){
          if(!m) continue;
          t+=0.2;
          if(m===GR) m.recognizeForVideo(vid,t);
          else m.detectForVideo(vid,t);
        }
      }
    }catch(_){}
    st('Всьо. Погнали!',100);
    const miss=Object.keys(dead);
    for(const k of miss){ const el=$('c-'+k); if(el) el.classList.add('dead'); layer[k]=false; }
    running=true; schedule();
    setTimeout(()=>{
      loader.classList.add('out');
      setTimeout(()=>loader.remove(),600);
      if(miss.length){
        const NM={face:'ЛИЦЕ',gest:'ЖЕСТИ',pose:'ПОЗА',seg:'СЕГМ',obj:'ОБ\u02BCЄКТИ'};
        toast('Не доїхали: '+miss.map(k=>NM[k]+' ('+(deadErr[k]||'?')+')').join(', '),3200);
      }
    },350);
    try{
      await navigator.wakeLock?.request('screen');
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible')
          navigator.wakeLock?.request('screen').catch(()=>{});
      });
    }catch(_){}
  }catch(err){
    const e=err.e||err;
    if(err.kind==='cam'){
      if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))
        fail('Камеру зарубали, брат. Дозволь доступ у налаштуваннях браузера і тисни «ЩЕ РАЗ».');
      else if(e&&e.name==='NotFoundError')
        fail('Камери не знайшов. Це шо за пристрій такий?');
      else
        fail('Камера впала: '+((e&&e.name)||'хз чого')+'. Спробуй «ЩЕ РАЗ».');
    }else if(err.kind==='cdn'){
      fail('CDN не доїхав — мережа шкутильгає. Тисни «ЩЕ РАЗ».');
    }else{
      fail('Шось пішло по бороді: '+((e&&e.name)||'')+'. Тисни «ЩЕ РАЗ».');
    }
  }
})();
</script>
