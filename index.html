<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neural Body Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ui-green: #00ffcc;
            --ui-yellow: #f8e71c;
            --bg-overlay: rgba(0, 0, 0, 0.5);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Chakra Petch', sans-serif;
            color: var(--ui-green);
        }

        #app-container {
            position: relative; width: 100vw; height: 100vh;
        }

        video#input-video { display: none; }

        canvas#gl-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            z-index: 1;
        }

        canvas#ui-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(0,255,204,0.1);
            border-top-color: var(--ui-green); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app-container">
    <video id="input-video" playsinline muted></video>
    <canvas id="gl-canvas"></canvas>
    <canvas id="ui-canvas"></canvas>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="letter-spacing: 2px; font-size: 10px;">INITIALIZING FULL_BODY_SCANNER...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<script>
    const videoElement = document.getElementById('input-video');
    const glCanvas = document.getElementById('gl-canvas');
    const glCtx = glCanvas.getContext('2d');
    const uiCanvas = document.getElementById('ui-canvas');
    const uiCtx = uiCanvas.getContext('2d');
    const loader = document.getElementById('loading-overlay');

    let fps = 0;
    let lastCalledTime;
    let width = window.innerWidth;
    let height = window.innerHeight;

    function onResize() {
        width = window.innerWidth;
        height = window.innerHeight;
        glCanvas.width = uiCanvas.width = width;
        glCanvas.height = uiCanvas.height = height;
    }
    window.addEventListener('resize', onResize);
    onResize();

    // --- 1. Инициализация Pose (Тело, Руки, Ноги) ---
    const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 1, // 0 - быстро, 1 - баланс, 2 - точно
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    // --- 2. Рендеринг скелета ---
    function onPoseResults(results) {
        if (loader.style.display !== 'none') {
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        glCtx.save();
        glCtx.clearRect(0, 0, width, height); 
        
        if (results.poseLandmarks) {
            // Рисуем связи (ноги, руки, торс)
            // Исключаем голову (индексы 0-10 в Pose отвечают за лицо)
            // Мы будем использовать стандартные коннекторы, но фильтровать их
            
            const landmarks = results.poseLandmarks;
            
            // Отрисовка соединений
            drawConnectors(glCtx, landmarks, POSE_CONNECTIONS, {
                color: '#00ffcc',
                lineWidth: 2
            });

            // Отрисовка ключевых узлов (точек)
            landmarks.forEach((landmark, index) => {
                // Пропускаем точки лица (0-10)
                if (index <= 10) return;

                const x = landmark.x * width;
                const y = landmark.y * height;
                const visibility = landmark.visibility;

                if (visibility > 0.5) {
                    glCtx.beginPath();
                    glCtx.arc(x, y, 3, 0, 2 * Math.PI);
                    glCtx.fillStyle = (index > 10 && index < 23) ? '#00ffcc' : '#f8e71c';
                    glCtx.fill();
                    
                    // Эффект "объема" - дополнительные круги
                    glCtx.beginPath();
                    glCtx.arc(x, y, 6, 0, 2 * Math.PI);
                    glCtx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                    glCtx.stroke();
                }
            });
        }
        glCtx.restore();
    }

    // --- 3. Отрисовка полноэкранного HUD ---
    function drawUI() {
        requestAnimationFrame(drawUI);
        uiCtx.clearRect(0, 0, width, height);
        
        if(!lastCalledTime) { lastCalledTime = Date.now(); return; }
        let delta = (Date.now() - lastCalledTime)/1000;
        lastCalledTime = Date.now();
        fps = Math.round(1/delta);

        uiCtx.save();
        
        // Полноэкранная рамка (Corner Brackets)
        const margin = 20;
        const cl = 40; // Длина угла
        uiCtx.strokeStyle = '#00ffcc';
        uiCtx.lineWidth = 2;

        // Top-Left
        uiCtx.beginPath(); uiCtx.moveTo(margin, margin + cl); uiCtx.lineTo(margin, margin); uiCtx.lineTo(margin + cl, margin); uiCtx.stroke();
        // Top-Right
        uiCtx.beginPath(); uiCtx.moveTo(width - margin - cl, margin); uiCtx.lineTo(width - margin, margin); uiCtx.lineTo(width - margin, margin + cl); uiCtx.stroke();
        // Bottom-Left
        uiCtx.beginPath(); uiCtx.moveTo(margin, height - margin - cl); uiCtx.lineTo(margin, height - margin); uiCtx.lineTo(margin + cl, height - margin); uiCtx.stroke();
        // Bottom-Right
        uiCtx.beginPath(); uiCtx.moveTo(width - margin - cl, height - margin); uiCtx.lineTo(width - margin, height - margin); uiCtx.lineTo(width - margin, height - margin - cl); uiCtx.stroke();

        // Текстовая информация
        uiCtx.font = '10px "Chakra Petch"';
        uiCtx.fillStyle = '#00ffcc';
        
        uiCtx.fillText(`DATA_STREAM: CONNECTED`, margin + 10, margin + 60);
        uiCtx.fillText(`SCAN_TYPE: FULL_BODY_SEGMENTATION`, margin + 10, margin + 75);
        uiCtx.fillStyle = (fps > 24) ? '#00ffcc' : '#ff4444';
        uiCtx.fillText(`ENGINE_FPS: ${fps}`, margin + 10, margin + 90);

        // Индикатор захвата объекта (внизу)
        uiCtx.textAlign = 'center';
        uiCtx.fillStyle = '#00ffcc';
        uiCtx.fillText(`TARGET ACQUISITION: IN_PROGRESS`, width / 2, height - 40);
        
        // "Сетка" на фоне (слабая)
        uiCtx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
        uiCtx.lineWidth = 1;
        uiCtx.beginPath();
        for(let i = 0; i < width; i += 50) { uiCtx.moveTo(i, 0); uiCtx.lineTo(i, height); }
        for(let i = 0; i < height; i += 50) { uiCtx.moveTo(0, i); uiCtx.lineTo(width, i); }
        uiCtx.stroke();

        uiCtx.restore();
    }

    // --- 4. Запуск камеры ---
    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await pose.send({image: videoElement});
        },
        width: 640,
        height: 480
    });

    camera.start();
    drawUI();
</script>
</body>
</html>
