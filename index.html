<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00311E">
<title>AXIOM Lite</title>
<style>
:root{--acc:#6AD582;--deep:#00311E;--panel:#0d3b25;--amber:#FFC13C;--red:#DF2F2E;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#00120b;touch-action:none;overscroll-behavior:none;}
body{font-family:ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace;color:var(--acc);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.3);z-index:1;}
#vid.mir{transform:scaleX(-1);}
#cv{position:absolute;inset:0;z-index:2;}
#fps{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));font-size:10px;letter-spacing:1px;color:rgba(106,213,130,.55);z-index:5;pointer-events:none;}
#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:14px;padding:14px 0 calc(14px + env(safe-area-inset-bottom));}
.btn{width:58px;height:58px;border-radius:9px;background:rgba(13,59,37,.92);border:1px solid rgba(106,213,130,.35);color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;transition:opacity .15s;}
.btn:active{transform:scale(.93);}
.btn svg{width:20px;height:20px;fill:var(--acc);}
.btn span{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75;}
.btn.off{opacity:.35;}
#loader{position:fixed;inset:0;z-index:50;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loader.out{opacity:0;pointer-events:none;}
.bar{width:210px;height:3px;background:rgba(106,213,130,.15);border-radius:3px;overflow:hidden;}
#fill{height:100%;width:0;background:var(--acc);transition:width .35s;}
#fill.err{background:var(--red);}
#ltxt{font-size:12px;letter-spacing:1px;text-align:center;max-width:82vw;line-height:1.55;}
#ltxt.err{color:var(--red);}
#retry{background:var(--panel);border:1px solid rgba(106,213,130,.35);color:var(--acc);font:inherit;font-size:11px;letter-spacing:2px;padding:10px 24px;border-radius:8px;cursor:pointer;margin-top:4px;}
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<canvas id="cv"></canvas>
<div id="fps">-- fps</div>
<div id="ctrl">
  <button class="btn" id="b-flip" aria-label="Змінити камеру"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg><span>Фліп</span></button>
  <button class="btn" id="b-hand" aria-label="Руки"><svg viewBox="0 0 24 24"><path d="M21 7c0-1.1-.9-2-2-2h-1V3c0-1.1-.9-2-2-2s-2 .9-2 2v2h-1c-.37 0-.72.1-1.02.26C11.7 4.1 11.37 4 11 4c-1.1 0-2 .9-2 2v1.28C8.69 7.1 8.37 7 8 7c-1.1 0-2 .9-2 2v5c0 3.31 2.69 6 6 6h2c3.31 0 6-2.69 6-6V7z"/></svg><span>Руки</span></button>
  <button class="btn" id="b-face" aria-label="Обличчя"><svg viewBox="0 0 24 24"><path d="M9 11.75c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25S9.69 11.75 9 11.75zm6 0c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25S15.69 11.75 15 11.75zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-4c-2.33 0-4.32-1.45-5.12-3.5h1.67c.69 1.19 1.97 2 3.45 2s2.75-.81 3.45-2h1.67c-.8 2.05-2.79 3.5-5.12 3.5z"/></svg><span>Лице</span></button>
</div>
<div id="loader">
  <div class="bar"><div id="fill"></div></div>
  <div id="ltxt">Розганяю тачку…</div>
  <button id="retry" hidden>ЩЕ РАЗ</button>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const vid=$('vid'), cv=$('cv'), ctx=cv.getContext('2d');
const fpsEl=$('fps'), ltxt=$('ltxt'), fill=$('fill'), loader=$('loader'), retry=$('retry');

const ACC='#6AD582', AMBER='#FFC13C', RED='#DF2F2E';
const TESS_COL='rgba(106,213,130,0.22)';
const VER='0.10.14';
const CDN=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`;
const MODELS='https://storage.googleapis.com/mediapipe-models';

// ── РОЗМІРИ ────────────────────────────────────────────
let W=0, H=0, DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,300));
resize();

// ── СТАН ───────────────────────────────────────────────
let FL=null, HL=null;                 // landmarker-и
let TESS, REYE, LEYE, LIPS, HCONN;    // таблиці з'єднань
let faceRes=null, handRes=null;
let showFace=true, showHands=true;
let facing='user', mirrored=true, stream=null;
let frameNo=0, running=false;
let fpsV=0, lastT=performance.now(), lastFpsUpd=0;

// ── ЛОАДЕР / СТАТУСИ (суржиком, як положено) ──────────
let prog=0;
function st(t,p){ ltxt.textContent=t; if(p>prog){ prog=p; fill.style.width=p+'%'; } }
function fail(t){ ltxt.textContent=t; ltxt.classList.add('err'); fill.classList.add('err'); retry.hidden=false; }
retry.addEventListener('click',()=>location.reload());

// ── КАМЕРА ─────────────────────────────────────────────
async function startCam(f){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:f, width:{ideal:640}, height:{ideal:480} }
  });
  vid.srcObject=stream;
  vid.muted=true;
  await vid.play();
}
function applyMirror(){
  mirrored = (facing==='user');
  vid.classList.toggle('mir', mirrored);
}

// ── НЕЙРОНКА ───────────────────────────────────────────
async function initVision(){
  const mp=await import(`${CDN}/vision_bundle.mjs`);
  const { FilesetResolver, FaceLandmarker, HandLandmarker }=mp;
  const fs=await FilesetResolver.forVisionTasks(`${CDN}/wasm`);
  const mk=async (Cls, model, extra)=>{
    const opts=d=>({ baseOptions:{ modelAssetPath:model, delegate:d }, runningMode:'VIDEO', ...extra });
    try{ return await Cls.createFromOptions(fs, opts('GPU')); }
    catch(e){ return await Cls.createFromOptions(fs, opts('CPU')); }
  };
  const [f,h]=await Promise.all([
    mk(FaceLandmarker, `${MODELS}/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
       { numFaces:1, outputFaceBlendshapes:false }),
    mk(HandLandmarker, `${MODELS}/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
       { numHands:2 })
  ]);
  FL=f; HL=h;
  TESS=FaceLandmarker.FACE_LANDMARKS_TESSELATION;
  REYE=FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE;
  LEYE=FaceLandmarker.FACE_LANDMARKS_LEFT_EYE;
  LIPS=FaceLandmarker.FACE_LANDMARKS_LIPS;
  HCONN=HandLandmarker.HAND_CONNECTIONS;
}

// ── ЦИКЛ: чергування кадрів ────────────────────────────
// Парні детекти — руки, непарні — обличчя. Якщо активний
// лише один — він крутиться щокадру (менша латентність).
const useRVFC='requestVideoFrameCallback' in HTMLVideoElement.prototype;
function schedule(){
  if(!running) return;
  if(useRVFC) vid.requestVideoFrameCallback(onFrame);
  else requestAnimationFrame(onFrame);
}
function onFrame(){
  const now=performance.now();
  if(vid.readyState>=2 && vid.videoWidth){
    frameNo++;
    const act=[];
    if(showHands && HL) act.push(0);
    if(showFace && FL) act.push(1);
    if(act.length){
      const w=act[frameNo % act.length];
      try{
        if(w===0) handRes=HL.detectForVideo(vid, now);
        else      faceRes=FL.detectForVideo(vid, now);
      }catch(_){}
    }
    draw();
    const dt=(now-lastT)||1; lastT=now;
    fpsV = fpsV ? fpsV*0.9 + (1000/dt)*0.1 : 1000/dt;
    if(now-lastFpsUpd>300){
      const f=Math.round(fpsV);
      fpsEl.textContent=f+' fps';
      fpsEl.style.color = f<15 ? RED : f<24 ? AMBER : 'rgba(106,213,130,.55)';
      lastFpsUpd=now;
    }
  }
  schedule();
}

// ── РЕНДЕР ─────────────────────────────────────────────
// cover-мапінг: лендмарки нормовані до кадру відео, а відео
// обрізане під екран — рахуємо зсув/масштаб і мапимо точки.
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw||!vh) return;
  const s=Math.max(W/vw, H/vh), dw=vw*s, dh=vh*s;
  const ox=(W-dw)/2, oy=(H-dh)/2;
  if(mirrored){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.lineCap='round'; ctx.lineJoin='round';

  if(showFace && faceRes){
    for(const lm of faceRes.faceLandmarks){
      strokeConn(lm, TESS, TESS_COL, 0.6, ox,oy,dw,dh);
      strokeConn(lm, REYE, ACC, 1.5, ox,oy,dw,dh);
      strokeConn(lm, LEYE, ACC, 1.5, ox,oy,dw,dh);
      strokeConn(lm, LIPS, ACC, 1.5, ox,oy,dw,dh);
    }
  }
  if(showHands && handRes){
    for(const lm of handRes.landmarks){
      strokeConn(lm, HCONN, ACC, 2, ox,oy,dw,dh);
      dots(lm, AMBER, 3, ox,oy,dw,dh);
    }
  }
}
// Один beginPath на групу — один stroke, нуль тіней.
function strokeConn(lm, conns, color, w, ox,oy,dw,dh){
  ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath();
  for(let i=0;i<conns.length;i++){
    const c=conns[i], a=lm[c.start], b=lm[c.end];
    ctx.moveTo(ox+a.x*dw, oy+a.y*dh);
    ctx.lineTo(ox+b.x*dw, oy+b.y*dh);
  }
  ctx.stroke();
}
function dots(lm, color, r, ox,oy,dw,dh){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(const p of lm){
    const x=ox+p.x*dw, y=oy+p.y*dh;
    ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832);
  }
  ctx.fill();
}

// ── КНОПКИ ─────────────────────────────────────────────
const bH=$('b-hand'), bF=$('b-face'), bFl=$('b-flip');
bH.addEventListener('click',()=>{
  showHands=!showHands;
  if(!showHands) handRes=null;
  bH.classList.toggle('off',!showHands);
});
bF.addEventListener('click',()=>{
  showFace=!showFace;
  if(!showFace) faceRes=null;
  bF.classList.toggle('off',!showFace);
});
let flipping=false;
bFl.addEventListener('click',async ()=>{
  if(flipping) return;
  flipping=true; bFl.classList.add('off');
  const prev=facing;
  facing = facing==='user' ? 'environment' : 'user';
  faceRes=null; handRes=null;
  try{ await startCam(facing); }
  catch(_){ facing=prev; try{ await startCam(facing); }catch(_2){} }
  applyMirror();
  flipping=false; bFl.classList.remove('off');
});

// Мобільні жести — в топку
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

// ── BOOT ───────────────────────────────────────────────
(async ()=>{
  try{
    st('Тягну нейронку з CDN…',12);
    const vp=initVision();
    vp.catch(()=>{});                      // ловимо нижче, без unhandled
    st('Дай добро на камеру, ша…',20);
    try{ await startCam(facing); }
    catch(e){ throw { kind:'cam', e }; }
    applyMirror();
    st('Камера є. Мізки ще їдуть…',55);
    try{ await vp; }
    catch(e){ throw { kind:'cdn', e }; }
    st('Прогріваю делегата…',92);
    try{
      const t=performance.now();
      if(vid.readyState>=2){ FL.detectForVideo(vid,t); HL.detectForVideo(vid,t+0.1); }
    }catch(_){}
    st('Всьо. Погнали!',100);
    running=true; schedule();
    setTimeout(()=>{
      loader.classList.add('out');
      setTimeout(()=>loader.remove(),600);
    },350);
    // Wake lock — щоб екран не засинав посеред скану
    try{
      await navigator.wakeLock?.request('screen');
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible')
          navigator.wakeLock?.request('screen').catch(()=>{});
      });
    }catch(_){}
  }catch(err){
    const e=err.e||err;
    if(err.kind==='cam'){
      if(e && (e.name==='NotAllowedError'||e.name==='SecurityError'))
        fail('Камеру зарубали, брат. Дозволь доступ у налаштуваннях браузера і тисни «ЩЕ РАЗ».');
      else if(e && e.name==='NotFoundError')
        fail('Камери не знайшов. Це шо за пристрій такий?');
      else
        fail('Камера впала: '+((e&&e.name)||'хз чого')+'. Спробуй «ЩЕ РАЗ».');
    }else if(err.kind==='cdn'){
      fail('CDN не доїхав — мережа шкутильгає. Тисни «ЩЕ РАЗ».');
    }else{
      fail('Шось пішло по бороді: '+((e&&e.name)||'')+'. Тисни «ЩЕ РАЗ».');
    }
  }
})();
</script>
</body>
</html>
