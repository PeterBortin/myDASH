<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI TACTICAL HUB</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

:root {
–g: #00ff41;
–g2: #00cc33;
–r: #ff003c;
–r2: #cc0030;
–y: #ffcc00;
–bg: #020a04;
–panel: #060e07;
–border: rgba(0,255,65,0.25);
}

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–bg);
color: var(–g);
font-family: ‘Share Tech Mono’, monospace;
height: 100dvh;
display: flex;
flex-direction: column;
overflow: hidden;
user-select: none;
}

/* ── HEADER ── */
header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 6px 14px;
border-bottom: 1px solid var(–border);
background: var(–panel);
flex-shrink: 0;
}
.logo {
font-family: ‘Orbitron’, monospace;
font-weight: 900;
font-size: 13px;
letter-spacing: 3px;
color: var(–g);
}
.logo span { color: var(–r); }
#clock {
font-size: 11px;
color: var(–g2);
letter-spacing: 2px;
}

/* ── MAIN LAYOUT ── */
.main {
display: flex;
flex: 1;
overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
width: 180px;
flex-shrink: 0;
border-right: 1px solid var(–border);
background: var(–panel);
display: flex;
flex-direction: column;
padding: 10px 8px;
gap: 6px;
overflow-y: auto;
}

.sidebar-title {
font-size: 9px;
letter-spacing: 2px;
color: var(–g2);
border-bottom: 1px solid var(–border);
padding-bottom: 4px;
margin-bottom: 2px;
}

.metric {
background: rgba(0,255,65,0.04);
border: 1px solid var(–border);
padding: 6px 8px;
}
.metric-label { font-size: 8px; letter-spacing: 1px; color: var(–g2); }
.metric-value { font-size: 14px; color: var(–g); margin-top: 2px; }
.metric-value.danger { color: var(–r); }
.metric-value.warn { color: var(–y); }

/* stat bar */
.bar-wrap { height: 3px; background: rgba(0,255,65,0.1); margin-top: 4px; }
.bar-fill { height: 100%; background: var(–g); transition: width 0.3s; }
.bar-fill.danger { background: var(–r); }

/* target list */
#target-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.tgt-item {
border: 1px solid var(–r);
padding: 5px 7px;
font-size: 9px;
animation: pulse-border 1s infinite;
color: var(–r);
}
@keyframes pulse-border {
0%,100% { border-color: var(–r); }
50%      { border-color: var(–r2); }
}
.tgt-item .tgt-id { font-size: 11px; font-weight: bold; }

/* ── VIEWPORT ── */
.viewport {
flex: 1;
position: relative;
overflow: hidden;
background: #000;
display: flex;
align-items: center;
justify-content: center;
}

#vid, #overlay {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
object-fit: contain;
}
#overlay { z-index: 5; pointer-events: none; }

/* scan lines */
.viewport::after {
content: ‘’;
position: absolute;
inset: 0;
background: repeating-linear-gradient(
to bottom,
transparent 0px, transparent 3px,
rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
);
pointer-events: none;
z-index: 10;
}

/* corner brackets */
.corner {
position: absolute;
width: 28px; height: 28px;
border-color: var(–g);
border-style: solid;
opacity: 0.5;
z-index: 11;
pointer-events: none;
}
.corner.tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; }
.corner.tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; }
.corner.bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; }
.corner.br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; }

/* center reticle */
.reticle {
position: absolute;
z-index: 11;
pointer-events: none;
opacity: 0.3;
}
.reticle::before, .reticle::after {
content: ‘’;
position: absolute;
background: var(–g);
}
.reticle::before { width: 1px; height: 30px; top: -15px; left: 0; }
.reticle::after  { width: 30px; height: 1px; left: -15px; top: 0; }

/* bottom HUD text */
.hud-bottom {
position: absolute;
bottom: 16px;
left: 50%;
transform: translateX(-50%);
z-index: 12;
font-size: 10px;
letter-spacing: 2px;
text-align: center;
pointer-events: none;
transition: color 0.2s;
}
.hud-bottom.locked { color: var(–r); animation: blink 0.5s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

/* ── BOTTOM PANEL ── */
.bottom-panel {
display: flex;
gap: 0;
border-top: 1px solid var(–border);
background: var(–panel);
flex-shrink: 0;
}

.btn {
flex: 1;
background: transparent;
border: none;
border-right: 1px solid var(–border);
color: var(–g2);
font-family: ‘Share Tech Mono’, monospace;
font-size: 9px;
letter-spacing: 1px;
padding: 10px 6px;
cursor: pointer;
transition: background 0.15s, color 0.15s;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
.btn:last-child { border-right: none; }
.btn .btn-icon { font-size: 16px; }
.btn:hover { background: rgba(0,255,65,0.07); color: var(–g); }
.btn:active { background: var(–g); color: #000; }
.btn.active { color: var(–g); border-top: 2px solid var(–g); }
.btn.danger-btn { color: var(–r); }
.btn.danger-btn:hover { background: rgba(255,0,60,0.1); }
.btn:disabled { opacity: 0.35; cursor: default; }

/* p2p modal */
#p2p-modal {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.85);
z-index: 100;
align-items: center;
justify-content: center;
}
#p2p-modal.open { display: flex; }
.modal-box {
background: var(–panel);
border: 1px solid var(–g);
padding: 20px;
width: 320px;
display: flex;
flex-direction: column;
gap: 12px;
}
.modal-box h2 { font-family: ‘Orbitron’, monospace; font-size: 12px; letter-spacing: 2px; }
.modal-box input {
background: transparent;
border: 1px solid var(–border);
color: var(–g);
font-family: ‘Share Tech Mono’, monospace;
font-size: 12px;
padding: 8px;
width: 100%;
outline: none;
}
.modal-box input:focus { border-color: var(–g); }
.modal-row { display: flex; gap: 8px; }
.modal-btn {
flex: 1; padding: 8px;
border: 1px solid var(–g); background: transparent;
color: var(–g); font-family: ‘Share Tech Mono’, monospace;
font-size: 10px; cursor: pointer; letter-spacing: 1px;
}
.modal-btn:hover { background: var(–g); color: #000; }
.modal-close { border-color: var(–r); color: var(–r); }
.modal-close:hover { background: var(–r); color: #000; }
.modal-info { font-size: 10px; color: var(–g2); line-height: 1.5; }

/* log */
#log {
font-size: 9px;
color: var(–g2);
line-height: 1.6;
max-height: 70px;
overflow-y: auto;
border-top: 1px solid var(–border);
padding-top: 4px;
}
#log .log-err { color: var(–r); }
#log .log-ok  { color: var(–g); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(–border); }
</style>

</head>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// GLOBALS
// ─────────────────────────────────────────────────────────────────────────────
const vid     = document.getElementById('vid');
const overlay = document.getElementById('overlay');
const ctx2d   = overlay.getContext('2d');

let aiModel   = null;
let aiActive  = false;
let aiLoop    = null;
let fpsTimer  = 0, fpsFrames = 0, fpsValue = 0;

let peer      = null;
let currentFacing = 'user';
let activeStream  = null;
let remoteMode    = false;

// ─────────────────────────────────────────────────────────────────────────────
// CLOCK
// ─────────────────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('ru-RU', { hour12: false });
}, 1000);

// ─────────────────────────────────────────────────────────────────────────────
// LOG
// ─────────────────────────────────────────────────────────────────────────────
function log(msg, type = '') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (type) line.className = `log-${type}`;
  line.textContent = `> ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  // keep max 20 lines
  while (el.children.length > 20) el.removeChild(el.firstChild);
}

// ─────────────────────────────────────────────────────────────────────────────
// 1. ИНИЦИАЛИЗАЦИЯ КАМЕРЫ + МОДЕЛИ
// ─────────────────────────────────────────────────────────────────────────────
async function initSystem() {
  setBtn('btn-init', false);
  setM('m-ai', 'ЗАГРУЗКА...', '');
  setHud('■ ЗАГРУЗКА МОДЕЛИ...', false);
  log('Запуск системы...');

  try {
    // Camera
    await startCamera();

    // Load BlazeFace
    log('Загрузка BlazeFace...');
    aiModel = await blazeface.load();
    log('Модель загружена', 'ok');

    setM('m-ai', 'ГОТОВО', '');
    setHud('■ READY — НАЖМИТЕ AI СКАНЕР', false);
    setBtn('btn-cam',  true);
    setBtn('btn-ai',   true);
    setBtn('btn-stop', true);
    setBtn('btn-init', false);
    document.getElementById('btn-init').textContent = '✓';
    log('Система активирована', 'ok');
  } catch(e) {
    log('Ошибка: ' + e.message, 'err');
    setM('m-ai', 'ОШИБКА', 'danger');
    setHud('■ ОШИБКА ИНИЦИАЛИЗАЦИИ', false);
    setBtn('btn-init', true);
  }
}

async function startCamera() {
  if (activeStream) activeStream.getTracks().forEach(t => t.stop());

  const constraints = {
    video: {
      facingMode: currentFacing,
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  };

  activeStream = await navigator.mediaDevices.getUserMedia(constraints);
  vid.srcObject = activeStream;

  await new Promise(res => {
    vid.onloadedmetadata = () => { vid.play(); res(); };
  });

  syncCanvas();
  log(`Камера: ${currentFacing === 'user' ? 'фронтальная' : 'основная'}`, 'ok');
}

function syncCanvas() {
  overlay.width  = vid.videoWidth  || 640;
  overlay.height = vid.videoHeight || 480;
}

// resize canvas if video size changes
vid.addEventListener('resize', syncCanvas);

// ─────────────────────────────────────────────────────────────────────────────
// 2. TOGGLE CAMERA
// ─────────────────────────────────────────────────────────────────────────────
async function toggleCamera() {
  if (!activeStream) return;
  currentFacing = currentFacing === 'user' ? 'environment' : 'user';
  try {
    await startCamera();
  } catch(e) {
    log('Смена камеры: ' + e.message, 'err');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// 3. AI SCANNER
// ─────────────────────────────────────────────────────────────────────────────
function toggleAI() {
  if (!aiModel) return;
  aiActive = !aiActive;
  const btn = document.getElementById('btn-ai');

  if (aiActive) {
    btn.classList.add('active');
    btn.innerHTML = '<span class="btn-icon">👁</span>AI: ON';
    setHud('■ СКАНИРОВАНИЕ...', false);
    setM('m-ai', 'ACTIVE', '');
    fpsTimer = performance.now();
    fpsFrames = 0;
    runAI();
    log('AI сканер активирован', 'ok');
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '<span class="btn-icon">👁</span>AI СКАНЕР';
    setHud('■ AI ВЫКЛЮЧЕН', false);
    setM('m-ai', 'OFFLINE', '');
    ctx2d.clearRect(0, 0, overlay.width, overlay.height);
    document.getElementById('target-list').innerHTML = '';
    document.getElementById('m-count').textContent = '0';
    log('AI сканер остановлен');
  }
}

async function runAI() {
  if (!aiActive || !aiModel) return;

  // Ensure canvas is in sync
  if (overlay.width !== vid.videoWidth || overlay.height !== vid.videoHeight) syncCanvas();

  const t0 = performance.now();
  let predictions = [];

  try {
    // returnTensors=false, flipHorizontal=false (canvas flips itself for user cam)
    predictions = await aiModel.estimateFaces(vid, false);
  } catch(e) {
    // model can fail on blank frame — just skip
  }

  const lat = Math.round(performance.now() - t0);

  // FPS
  fpsFrames++;
  if (performance.now() - fpsTimer >= 1000) {
    fpsValue  = fpsFrames;
    fpsFrames = 0;
    fpsTimer  = performance.now();
    document.getElementById('m-fps').textContent = fpsValue;
  }

  // Latency
  document.getElementById('m-lat').textContent = lat + ' ms';
  const latPct = Math.min(lat / 300 * 100, 100);
  const latBar = document.getElementById('lat-bar');
  latBar.style.width = latPct + '%';
  latBar.className   = 'bar-fill' + (lat > 150 ? ' danger' : '');

  // Draw
  ctx2d.clearRect(0, 0, overlay.width, overlay.height);
  updateTargetList(predictions);

  predictions.forEach((face, i) => {
    const [x1, y1] = face.topLeft;
    const [x2, y2] = face.bottomRight;
    const w = x2 - x1, h = y2 - y1;
    const cx = x1 + w / 2, cy = y1 + h / 2;
    const conf = face.probability ? Math.round(face.probability[0] * 100) : '?';

    // Red box
    ctx2d.strokeStyle = '#ff003c';
    ctx2d.lineWidth   = 2;
    ctx2d.strokeRect(x1, y1, w, h);

    // Corner brackets
    const s = Math.min(w, h) * 0.25;
    ctx2d.strokeStyle = '#ff003c';
    ctx2d.lineWidth   = 3;
    [[x1, y1, 1, 1], [x2, y1, -1, 1], [x1, y2, 1, -1], [x2, y2, -1, -1]].forEach(([bx, by, dx, dy]) => {
      ctx2d.beginPath();
      ctx2d.moveTo(bx + dx * s, by);
      ctx2d.lineTo(bx, by);
      ctx2d.lineTo(bx, by + dy * s);
      ctx2d.stroke();
    });

    // Crosshair at center
    ctx2d.strokeStyle = 'rgba(255,0,60,0.7)';
    ctx2d.lineWidth   = 1;
    ctx2d.beginPath();
    ctx2d.moveTo(cx - 12, cy); ctx2d.lineTo(cx + 12, cy);
    ctx2d.moveTo(cx, cy - 12); ctx2d.lineTo(cx, cy + 12);
    ctx2d.stroke();

    // Label
    ctx2d.fillStyle = 'rgba(255,0,60,0.8)';
    ctx2d.fillRect(x1, y1 - 16, w, 16);
    ctx2d.fillStyle = '#fff';
    ctx2d.font = '10px "Share Tech Mono", monospace';
    ctx2d.fillText(`TGT-${String(i+1).padStart(2,'0')} ${conf}%`, x1 + 3, y1 - 4);

    // Keypoints
    if (face.landmarks) {
      ctx2d.fillStyle = '#ffcc00';
      face.landmarks.forEach(([lx, ly]) => {
        ctx2d.beginPath();
        ctx2d.arc(lx, ly, 2, 0, Math.PI * 2);
        ctx2d.fill();
      });
    }
  });

  // HUD
  const n = predictions.length;
  document.getElementById('m-count').textContent = n;
  if (n > 0) {
    setHud(`◉ LOCKED: ${n} TARGET${n > 1 ? 'S' : ''}`, true);
  } else {
    setHud('■ СКАНИРОВАНИЕ... NO CONTACT', false);
  }

  requestAnimationFrame(runAI);
}

function updateTargetList(faces) {
  const list = document.getElementById('target-list');
  list.innerHTML = '';
  faces.forEach((f, i) => {
    const [x1, y1] = f.topLeft;
    const [x2, y2] = f.bottomRight;
    const conf = f.probability ? Math.round(f.probability[0] * 100) : '?';
    const el = document.createElement('div');
    el.className = 'tgt-item';
    el.innerHTML = `<div class="tgt-id">TGT-${String(i+1).padStart(2,'0')}</div>
      CONF: ${conf}%<br>
      X:${Math.round(x1)} Y:${Math.round(y1)}<br>
      W:${Math.round(x2-x1)} H:${Math.round(y2-y1)}`;
    list.appendChild(el);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// 4. P2P
// ─────────────────────────────────────────────────────────────────────────────
function openP2P() {
  document.getElementById('p2p-modal').classList.add('open');
  if (!peer) initPeer();
}
function closeP2P() {
  document.getElementById('p2p-modal').classList.remove('open');
}

function initPeer() {
  document.getElementById('p2p-myid').textContent = 'Мой ID: генерация...';
  peer = new Peer();

  peer.on('open', id => {
    document.getElementById('p2p-myid').innerHTML =
      `Мой ID: <b style="color:var(--g)">${id}</b>`;
    setM('m-p2p', 'READY', 'warn');
    log('P2P ID: ' + id, 'ok');
  });

  peer.on('call', incoming => {
    document.getElementById('p2p-status').textContent = 'Входящий звонок...';
    incoming.answer();
    incoming.on('stream', remote => {
      vid.srcObject = remote;
      remoteMode = true;
      setM('m-p2p', 'RX', '');
      document.getElementById('p2p-status').textContent = 'Получение потока';
      log('P2P: приём потока', 'ok');
    });
  });

  peer.on('error', e => {
    log('P2P ошибка: ' + e.type, 'err');
    setM('m-p2p', 'ERR', 'danger');
  });
}

function startCall() {
  const target = document.getElementById('p2p-input').value.trim();
  if (!target) { log('Введите ID получателя', 'err'); return; }
  if (!activeStream) { log('Сначала запустите камеру', 'err'); return; }

  const call = peer.call(target, activeStream);
  setM('m-p2p', 'TX...', 'warn');
  document.getElementById('p2p-status').textContent = 'Соединение...';
  log('P2P: вызов ' + target);

  call.on('stream', () => {
    setM('m-p2p', 'ONLINE', '');
    document.getElementById('p2p-status').textContent = 'Трансляция активна';
    log('P2P: трансляция', 'ok');
  });
  call.on('error', e => {
    log('Call error: ' + e, 'err');
    setM('m-p2p', 'ERR', 'danger');
  });

  closeP2P();
}

// ─────────────────────────────────────────────────────────────────────────────
// 5. STOP ALL
// ─────────────────────────────────────────────────────────────────────────────
function stopAll() {
  aiActive = false;
  ctx2d.clearRect(0, 0, overlay.width, overlay.height);

  if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
  if (peer) { peer.destroy(); peer = null; }
  vid.srcObject = null;

  setM('m-ai', 'OFFLINE', '');
  setM('m-p2p', 'OFFLINE', 'warn');
  setM('m-fps', '—', '');
  setM('m-lat', '—', '');
  document.getElementById('m-count').textContent = '0';
  document.getElementById('target-list').innerHTML = '';
  document.getElementById('btn-ai').classList.remove('active');
  document.getElementById('btn-ai').innerHTML = '<span class="btn-icon">👁</span>AI СКАНЕР';
  setHud('■ СИСТЕМА ОСТАНОВЛЕНА', false);

  setBtn('btn-cam',  false);
  setBtn('btn-ai',   false);
  setBtn('btn-stop', false);
  setBtn('btn-init', true);
  document.getElementById('btn-init').innerHTML = '<span class="btn-icon">⚡</span>ИНИЦИАЛИЗАЦИЯ';
  log('Система остановлена');
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function setM(id, val, cls) {
  const el = document.getElementById(id);
  el.textContent = val;
  el.className = 'metric-value' + (cls ? ' ' + cls : '');
}

function setBtn(id, enabled) {
  document.getElementById(id).disabled = !enabled;
}

function setHud(text, locked) {
  const h = document.getElementById('hud-status');
  h.textContent = text;
  h.className   = 'hud-bottom' + (locked ? ' locked' : '');
}
</script>
