<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Tactical Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --neon: #00ff41; --danger: #ff003c; }
        body { margin: 0; background: #000; color: var(--neon); font-family: monospace; overflow: hidden; }
        
        /* Сетка интерфейса */
        .grid-ui {
            display: grid;
            grid-template-rows: 1fr 120px;
            height: 100vh;
        }

        .viewport {
            position: relative;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video, canvas {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: contain;
        }

        /* Телеметрия (OSD) */
        .osd-layer {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px solid rgba(0, 255, 65, 0.2);
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stats { background: rgba(0,0,0,0.7); padding: 5px; font-size: 10px; line-height: 1.4; }

        /* Панель управления */
        .bottom-panel {
            background: #111;
            border-top: 2px solid var(--neon);
            padding: 10px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .btn {
            background: transparent; border: 1px solid var(--neon);
            color: var(--neon); padding: 10px; cursor: pointer;
            min-width: 100px; font-size: 10px;
        }
        .btn:active { background: var(--neon); color: #000; }
        .target-found { color: var(--danger); font-weight: bold; animation: blink 0.5s infinite; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="grid-ui">
    <div class="viewport">
        <video id="v" playsinline muted autoplay></video>
        <canvas id="c"></canvas>
        
        <div class="osd-layer">
            <div style="display: flex; justify-content: space-between;">
                <div class="stats" id="ai-stats">AI: STANDBY<br>FPS: 0</div>
                <div class="stats" id="net-stats">P2P: DISCONNECTED<br>ID: ---</div>
            </div>
            <div class="stats" style="text-align: center;" id="target-info">NO TARGETS IN SECTOR</div>
        </div>
    </div>

    <div class="bottom-panel">
        <button class="btn" onclick="initCore()">1. ИНИЦИАЦИЯ СИСТЕМЫ</button>
        <button class="btn" onclick="startStream()">2. P2P ТРАНСЛЯЦИЯ</button>
        <button class="btn" onclick="toggleCam()">3. СМЕНА КАМЕРЫ</button>
    </div>
</div>

<script>
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let model, peer, currentFacing = "user";

    // Профит 1: Реализация AI Сканера
    async function initCore() {
        document.getElementById('ai-stats').innerHTML = "AI: LOADING...";
        model = await blazeface.load();
        
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacing },
            audio: false
        });
        v.srcObject = stream;
        
        v.onloadedmetadata = () => {
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            renderLoop();
        };
    }

    async function renderLoop() {
        const start = performance.now();
        const predictions = await model.estimateFaces(v, false);
        
        ctx.clearRect(0, 0, c.width, c.height);
        
        if (predictions.length > 0) {
            document.getElementById('target-info').className = "stats target-found";
            document.getElementById('target-info').innerText = `TARGET DETECTED: ID-ALPHA-${predictions.length}`;
            
            predictions.forEach(face => {
                const [x, y] = face.topLeft;
                const [x2, y2] = face.bottomRight;
                // Рисуем рамку захвата
                ctx.strokeStyle = "#ff003c";
                ctx.lineWidth = 4;
                ctx.strokeRect(x, y, x2 - x, y2 - y);
                // Рисуем перекрестие
                ctx.beginPath();
                ctx.moveTo(x + (x2-x)/2, y - 10); ctx.lineTo(x + (x2-x)/2, y + 10);
                ctx.stroke();
            });
        } else {
            document.getElementById('target-info').className = "stats";
            document.getElementById('target-info').innerText = "NO TARGETS IN SECTOR";
        }

        const end = performance.now();
        document.getElementById('ai-stats').innerHTML = `AI: ONLINE<br>LATENCY: ${Math.round(end-start)}ms`;
        requestAnimationFrame(renderLoop);
    }

    // Профит 2: Реализация P2P Сети
    function startStream() {
        peer = new Peer();
        peer.on('open', id => {
            document.getElementById('net-stats').innerHTML = `P2P: READY<br>ID: ${id}`;
            const target = prompt("Введите ID получателя (или оставьте пустым для ожидания):");
            if (target) {
                const call = peer.call(target, v.srcObject);
                document.getElementById('net-stats').innerText = "P2P: STREAMING...";
            }
        });

        peer.on('call', call => {
            if(confirm("Принять входящий поток?")) {
                call.answer();
                call.on('stream', remoteStream => {
                    v.srcObject = remoteStream;
                    document.getElementById('net-stats').innerText = "P2P: RECEIVING DATA";
                });
            }
        });
    }

    // Доп. функция для мобильных: Переключение камер
    async function toggleCam() {
        currentFacing = currentFacing === "user" ? "environment" : "user";
        if (v.srcObject) {
            v.srcObject.getTracks().forEach(t => t.stop());
            initCore();
        }
    }
</script>
</body>
</html>
