<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Tactical Hub Fullscreen</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --neon: #00ff41; --dim-neon: rgba(0, 255, 65, 0.15); --alert: #ff003c; --bg: #000; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; }

        /* Основной контейнер на весь экран */
        .main-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding-bottom: env(safe-area-inset-bottom); /* Отступ под "полоску" iOS */
        }

        /* Зона визиря */
        .viewport-container {
            position: relative;
            flex: 1; /* Занимает всё доступное место, кроме кнопок */
            background: #050505;
            overflow: hidden;
            border-bottom: 1px solid var(--neon);
        }

        #webcam, #overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            object-fit: cover; /* Заполняет экран полностью */
        }

        /* HUD элементы поверх видео */
        .hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between;
            z-index: 10; font-size: 10px; text-shadow: 1px 1px 2px #000;
        }

        .event-log {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            height: 80px; background: rgba(0,0,0,0.5);
            border-left: 2px solid var(--neon);
            padding: 5px; font-size: 10px; overflow-y: hidden;
            display: flex; flex-direction: column-reverse;
            z-index: 10; backdrop-filter: blur(2px);
        }

        .log-entry { margin-bottom: 2px; opacity: 0.8; animation: blink 0.2s ease; }

        /* Панель управления */
        .action-bar {
            height: 70px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--neon);
        }

        .btn {
            background: #111; border: none; color: var(--neon);
            text-transform: uppercase; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .btn:active { background: var(--neon); color: #000; }
        .btn:disabled { color: #333; }

        /* Спец-эффекты */
        .scan-anim {
            position: absolute; width: 100%; height: 2px;
            background: var(--neon); box-shadow: 0 0 15px var(--neon);
            z-index: 5; animation: scanMove 4s linear infinite;
        }

        @keyframes scanMove { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes blink { from { opacity: 0; } to { opacity: 0.8; } }
    </style>
</head>
<body>

<div class="main-app">
    <div class="viewport-container">
        <div class="scan-anim"></div>
        <div class="hud-top">
            <div id="status">STATUS: STANDBY</div>
            <div id="ai-load">CPU: 0%</div>
        </div>

        <video id="webcam" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>

        <div class="event-log" id="log">
            <div class="log-entry">> SYSTEM BOOT READY...</div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn" id="initBtn" onclick="runAI()">START AI</button>
        <button class="btn" onclick="exportLog()">PDF LOG</button>
        <button class="btn" onclick="flip()">FLIP CAM</button>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('log');
    
    let detector;
    let history = [];
    let facing = "user";

    async function runAI() {
        document.getElementById('status').innerText = "LOADING COCO-SSD...";
        document.getElementById('initBtn').disabled = true;

        try {
            detector = await cocossd.load();
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facing }, audio: false
            });
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                addLog("AI KERNEL ONLINE");
                document.getElementById('status').innerText = "SCANNING...";
                loop();
            };
        } catch (e) {
            addLog("ERR: " + e.message);
        }
    }

    async function loop() {
        if (!detector) return;
        
        const start = performance.now();
        const predictions = await detector.detect(video);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        predictions.forEach(p => {
            const [x, y, w, h] = p.bbox;
            // Рамка
            ctx.strokeStyle = "#00ff41";
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(x, y, w, h);
            
            // Текст
            ctx.fillStyle = "#00ff41";
            ctx.fillText(`${p.class.toUpperCase()}`, x + 5, y + 15);

            if (p.score > 0.6) {
                logOnce(p.class);
            }
        });

        const end = performance.now();
        document.getElementById('ai-load').innerText = `LATENCY: ${Math.round(end-start)}ms`;
        requestAnimationFrame(loop);
    }

    function logOnce(label) {
        const now = new Date();
        if (history.length === 0 || history[history.length-1].label !== label || (now - history[history.length-1].time > 3000)) {
            history.push({ label, time: now, str: now.toLocaleTimeString() });
            addLog(`DETECTED: ${label.toUpperCase()}`);
        }
    }

    function addLog(msg) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerText = `> ${msg}`;
        logBox.prepend(div);
        if (logBox.children.length > 5) logBox.lastChild.remove();
    }

    function exportLog() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFont("courier");
        doc.text("TACTICAL LOG REPORT", 10, 10);
        history.forEach((h, i) => doc.text(`${i+1}. [${h.str}] ${h.label}`, 10, 20 + i*7));
        doc.save("ai_report.pdf");
        addLog("PDF GENERATED");
    }

    function flip() {
        facing = facing === "user" ? "environment" : "user";
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
            runAI();
        }
    }
</script>
</body>
</html>
