<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00311E">
<title>AXIOM</title>
<style>
:root{--acc:#6AD582;--deep:#00311E;--panel:#0d3b25;--amber:#FFC13C;--red:#DF2F2E;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#00120b;touch-action:none;overscroll-behavior:none;}
body{font-family:ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace;color:var(--acc);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.3);z-index:1;}
#vid.mir{transform:scaleX(-1);}
#cv{position:absolute;inset:0;z-index:2;}
#gl{position:absolute;inset:0;z-index:3;display:none;touch-action:none;}
body.m3 #gl{display:block;}
body.m3 #cv{visibility:hidden;}
#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:14px;padding:14px 0 calc(14px + env(safe-area-inset-bottom));}
.btn{width:58px;height:58px;border-radius:9px;background:rgba(13,59,37,.92);border:1px solid rgba(106,213,130,.35);color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;transition:opacity .15s;}
.btn:active{transform:scale(.93);}
.btn svg{width:20px;height:20px;fill:var(--acc);}
.btn span{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75;}
.btn.off{opacity:.35;}
.btn.on{border-color:var(--amber);box-shadow:0 0 10px rgba(255,193,60,.25);}
#panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:none;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(13,59,37,.95);border:1px solid rgba(106,213,130,.35);border-radius:10px;padding:10px;}
#panel.open{display:grid;}
.chip{min-width:74px;height:36px;border-radius:7px;background:rgba(0,49,30,.9);border:1px solid rgba(106,213,130,.4);color:var(--acc);font:inherit;font-size:9px;letter-spacing:1.5px;cursor:pointer;touch-action:manipulation;}
.chip.off{opacity:.35;}
.chip.dead{opacity:.15;pointer-events:none;}
.chip.warn{border-color:var(--red);color:var(--red);}
#modetab{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:flex;background:rgba(13,59,37,.92);border:1px solid rgba(106,213,130,.35);border-radius:9px;overflow:hidden;}
.mt{width:76px;height:36px;background:transparent;border:none;color:var(--acc);font:inherit;font-size:10px;letter-spacing:2px;cursor:pointer;touch-action:manipulation;opacity:.45;}
.mt.on{opacity:1;background:rgba(106,213,130,.12);color:var(--amber);}
body.m3 .oe{display:none!important;}
body:not(.m3) .o3{display:none!important;}
#expop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:none;gap:8px;background:rgba(13,59,37,.95);border:1px solid rgba(106,213,130,.35);border-radius:10px;padding:10px;}
#expop.open{display:flex;}
#shade{position:fixed;inset:0;z-index:19;background:rgba(0,4,2,.45);display:none;}
#shade.open{display:block;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,32,20,.97);border-top:1px solid rgba(106,213,130,.35);border-radius:14px 14px 0 0;transform:translateY(102%);transition:transform .28s ease;max-height:72vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
#sheet.open{transform:translateY(0);}
#grip{width:44px;height:4px;border-radius:2px;background:rgba(106,213,130,.4);margin:10px auto 6px;flex:none;}
#sbody{overflow-y:auto;touch-action:pan-y;padding:4px 16px 18px;}
.sh{font-size:9px;letter-spacing:3px;color:var(--amber);margin:14px 0 6px;}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:10px;letter-spacing:1px;}
.srow input[type=range]{flex:1;max-width:52%;accent-color:var(--acc);height:20px;touch-action:none;}
.sv{min-width:34px;text-align:right;color:var(--amber);font-size:9px;}
.tgl{min-width:46px;height:26px;border-radius:6px;background:rgba(0,49,30,.9);border:1px solid rgba(106,213,130,.4);color:var(--acc);font:inherit;font-size:8px;letter-spacing:1px;cursor:pointer;touch-action:manipulation;}
.tgl.off{opacity:.35;}
#s-reset{margin:12px auto 4px;display:block;background:rgba(0,49,30,.9);border:1px solid var(--red);color:var(--red);font:inherit;font-size:9px;letter-spacing:2px;padding:9px 20px;border-radius:8px;cursor:pointer;}
#joy{position:absolute;z-index:7;width:96px;height:96px;border-radius:50%;border:1px solid rgba(106,213,130,.4);background:rgba(13,59,37,.35);display:none;pointer-events:none;transform:translate(-50%,-50%);}
#knob{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(106,213,130,.5);left:50%;top:50%;transform:translate(-50%,-50%);}
#toastbox{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:rgba(13,59,37,.92);border:1px solid rgba(106,213,130,.35);color:var(--acc);font-size:10px;letter-spacing:1px;padding:6px 12px;border-radius:6px;white-space:nowrap;}
#loader{position:fixed;inset:0;z-index:50;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
#loader.out{opacity:0;pointer-events:none;}
.bar{width:210px;height:3px;background:rgba(106,213,130,.15);border-radius:3px;overflow:hidden;}
#fill{height:100%;width:0;background:var(--acc);transition:width .35s;}
#fill.err{background:var(--red);}
#ltxt{font-size:12px;letter-spacing:1px;text-align:center;max-width:82vw;line-height:1.55;}
#ltxt.err{color:var(--red);}
#retry{background:var(--panel);border:1px solid rgba(106,213,130,.35);color:var(--acc);font:inherit;font-size:11px;letter-spacing:2px;padding:10px 24px;border-radius:8px;cursor:pointer;margin-top:4px;}
</style>
</head>
<body>
<video id="vid" playsinline muted autoplay></video>
<canvas id="cv"></canvas>
<canvas id="gl"></canvas>
<div id="modetab">
  <button class="mt on" id="m-efir">ЕФІР</button>
  <button class="mt" id="m-3d">3D</button>
</div>
<div id="expop">
  <button class="chip" id="e-ply">PLY</button>
  <button class="chip" id="e-obj">OBJ</button>
  <button class="chip" id="e-glb">GLB</button>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="toastbox"></div>
<div id="panel">
  <button class="chip" id="c-face">ЛИЦЕ</button>
  <button class="chip" id="c-gest">ЖЕСТИ</button>
  <button class="chip" id="c-pose">ПОЗА</button>
  <button class="chip" id="c-seg">СЕГМ</button>
  <button class="chip" id="c-obj">ОБ'ЄКТИ</button>
  <button class="chip warn" id="c-clear">СТЕРТИ</button>
</div>
<div id="ctrl">
  <button class="btn oe" id="b-flip" aria-label="Змінити камеру"><svg viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg><span>Фліп</span></button>
  <button class="btn oe" id="b-layers" aria-label="Шари"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg><span>Шари</span></button>
  <button class="btn o3" id="b-freeze" aria-label="Заморозити"><svg viewBox="0 0 24 24"><path d="M22 11h-4.17l3.24-3.24-1.41-1.42L15 11h-2V9l4.66-4.66-1.42-1.41L13 6.17V2h-2v4.17L7.76 2.93 6.34 4.34 11 9v2H9L4.34 6.34 2.93 7.76 6.17 11H2v2h4.17l-3.24 3.24 1.41 1.42L9 13h2v2l-4.66 4.66 1.42 1.41L11 17.83V22h2v-4.17l3.24 3.24 1.42-1.41L13 15v-2h2l4.66 4.66 1.41-1.42L17.83 13H22v-2z"/></svg><span>Фріз</span></button>
  <button class="btn o3" id="b-dive" aria-label="Пірнути"><svg viewBox="0 0 24 24"><path d="M11 4h2v10.17l3.59-3.58L18 12l-6 6-6-6 1.41-1.41L11 14.17V4zM4 20h16v2H4v-2z"/></svg><span>Пірнути</span></button>
  <button class="btn o3" id="b-export" aria-label="Експорт"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg><span>Експорт</span></button>
  <button class="btn" id="b-set" aria-label="Налаштування"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7 7 0 0 0 .06-.94 7 7 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7 7 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.19.12.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg><span>Налашт</span></button>
</div>
<div id="shade"></div>
<div id="sheet">
  <div id="grip"></div>
  <div id="sbody">
    <div class="sh">// ЕФІР</div>
    <div class="srow"><span>ЯСКРАВІСТЬ ВІДЕО</span><input type="range" id="r-br" min="15" max="60" step="1"><span class="sv" id="v-br"></span></div>
    <div class="srow"><span>ТЕССЕЛЯЦІЯ</span><button class="tgl" id="g-tess">ВКЛ</button></div>
    <div class="srow"><span>ПРОЗОРІСТЬ ТЕСС.</span><input type="range" id="r-ta" min="5" max="50" step="1"><span class="sv" id="v-ta"></span></div>
    <div class="srow"><span>ТОВЩИНА ЛІНІЙ</span><input type="range" id="r-lw" min="10" max="30" step="1"><span class="sv" id="v-lw"></span></div>
    <div class="srow"><span>БАРИ МІМІКИ</span><button class="tgl" id="g-bars">ВКЛ</button></div>
    <div class="srow"><span>КОМПАС + ДИСТ</span><button class="tgl" id="g-pose">ВКЛ</button></div>
    <div class="srow"><span>ПОГЛЯД</span><button class="tgl" id="g-gaze">ВКЛ</button></div>
    <div class="srow"><span>ПОРІГ ОБ'ЄКТІВ</span><input type="range" id="r-thr" min="30" max="80" step="5"><span class="sv" id="v-thr"></span></div>
    <div class="srow"><span>КОНТУР СЕГМ.</span><button class="tgl" id="g-edge">ВКЛ</button></div>
    <div class="srow"><span>ЗАТЕМНЕННЯ СЕГМ.</span><button class="tgl" id="g-dim">ВКЛ</button></div>
    <div class="sh">// 3D</div>
    <div class="srow"><span>РОЗМІР ТОЧОК</span><input type="range" id="r-pt" min="50" max="200" step="10"><span class="sv" id="v-pt"></span></div>
    <div class="srow"><span>СІТКА-ПІДЛОГА</span><button class="tgl" id="g-grid">ВКЛ</button></div>
    <div class="srow"><span>ШВИДКІСТЬ ПОЛЬОТУ</span><input type="range" id="r-fs" min="50" max="400" step="10"><span class="sv" id="v-fs"></span></div>
    <button id="s-reset">СКИНУТИ ВСЕ</button>
  </div>
</div>
<div id="loader">
  <div class="bar"><div id="fill"></div></div>
  <div id="ltxt">Розганяю тачку…</div>
  <button id="retry" hidden>ЩЕ РАЗ</button>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const vid=$('vid'), cv=$('cv'), ctx=cv.getContext('2d'), glc=$('gl');
const ltxt=$('ltxt'), fill=$('fill'), loader=$('loader'), retry=$('retry');
const panel=$('panel');

const ACC='#6AD582', AMBER='#FFC13C', RED='#DF2F2E';
const ACC_D='rgba(106,213,130,.55)';
const TESS_COL='rgba(106,213,130,0.22)';
const VER='0.10.14';
const CDN=`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VER}`;
const MODELS='https://storage.googleapis.com/mediapipe-models';
const FONT="ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace";

//#region PURE — чиста математика, ганяється у headless-харнесі
function coverMap(vw,vh,W,H){
  const s=Math.max(W/vw,H/vh), dw=vw*s, dh=vh*s;
  return { s, dw, dh, ox:(W-dw)/2, oy:(H-dh)/2 };
}
// Зважений round-robin: [['face',2],['gest',2],['pose',1]] -> f,g,p,f,g
function buildQueue(items){
  const left=items.map(i=>i[1]), q=[];
  let rem=left.reduce((a,b)=>a+b,0);
  while(rem>0){
    for(let i=0;i<items.length;i++){
      if(left[i]>0){ q.push(items[i][0]); left[i]--; rem--; }
    }
  }
  return q;
}
// Кути з колонково-мажорної 4x4 (розклад YXZ: yaw->pitch->roll)
function eulerFromMat(d){
  const r02=d[8], r22=d[10], r12=d[9], r10=d[1], r11=d[5];
  const cl=v=>Math.max(-1,Math.min(1,v));
  return { yaw:Math.atan2(r02,r22), pitch:Math.asin(cl(-r12)), roll:Math.atan2(r10,r11) };
}
// Marching squares по сітці gw x gh, поріг t.
// Повертає плоский масив сегментів [x0,y0,x1,y1,...] у координатах сітки.
function marchingSquares(v,gw,gh,t){
  const seg=[];
  const ix=(a,b)=>{ const f=b-a; return f?Math.max(0,Math.min(1,(t-a)/f)):0.5; };
  for(let y=0;y<gh-1;y++){
    const row=y*gw, row2=(y+1)*gw;
    for(let x=0;x<gw-1;x++){
      const tl=v[row+x], tr=v[row+x+1], br=v[row2+x+1], bl=v[row2+x];
      let c=0; if(tl>t)c|=8; if(tr>t)c|=4; if(br>t)c|=2; if(bl>t)c|=1;
      if(c===0||c===15) continue;
      const T=[x+ix(tl,tr),y], R=[x+1,y+ix(tr,br)], B=[x+ix(bl,br),y+1], L=[x,y+ix(tl,bl)];
      const add=(p,q)=>{ seg.push(p[0],p[1],q[0],q[1]); };
      switch(c){
        case 1: add(L,B); break;   case 14: add(L,B); break;
        case 2: add(B,R); break;   case 13: add(B,R); break;
        case 3: add(L,R); break;   case 12: add(L,R); break;
        case 4: add(T,R); break;   case 11: add(T,R); break;
        case 6: add(T,B); break;   case 9:  add(T,B); break;
        case 7: add(L,T); break;   case 8:  add(L,T); break;
        case 5:{ const m=(tl+tr+br+bl)/4;
          if(m>t){ add(T,R); add(L,B); } else { add(L,T); add(B,R); } break; }
        case 10:{ const m=(tl+tr+br+bl)/4;
          if(m>t){ add(L,T); add(B,R); } else { add(T,R); add(L,B); } break; }
      }
    }
  }
  return seg;
}
function uniqIdx(conns){
  const s=new Set();
  for(const c of conns){ s.add(c.start); s.add(c.end); }
  return [...s];
}
// Внутрішня петля ротового отвору (канонічні індекси FaceMesh, 20 ребер)
const INNER_LIPS=[[78,95],[95,88],[88,178],[178,87],[87,14],[14,317],[317,402],
[402,318],[318,324],[324,308],[78,191],[191,80],[80,81],[81,82],[82,13],
[13,312],[312,311],[311,310],[310,415],[415,308]].map(p=>({start:p[0],end:p[1]}));
// Мапінг лендмарка у простір 3D-сцени (без центрування)
function mapPt(p,a,mir){
  return [ (mir?(0.5-p.x):(p.x-0.5))*a*1.4, (0.5-p.y)*1.4, -(p.z||0)*a*1.4 ];
}
// Збирач хмари: сутності -> спільні вершини/кольори/ребра (offset-індексація)
function buildCloud(ents,a,mir,c,s){
  const pos=[], col=[], edges=[];
  for(const e of ents){
    for(const lm of e.lms){
      const base=pos.length/3;
      for(const p of lm){
        const m=mapPt(p,a,mir);
        pos.push((m[0]-c[0])*s,(m[1]-c[1])*s,(m[2]-c[2])*s);
        col.push(e.color[0],e.color[1],e.color[2]);
      }
      for(const cn of e.conns) edges.push(base+cn.start,base+cn.end);
    }
  }
  return { pos, col, edges };
}
// PLY ASCII: вершини з кольором + element edge
function writePLY(c){
  const n=c.pos.length/3, m=c.edges.length/2;
  let s='ply\nformat ascii 1.0\ncomment AXIOM cloud\n'+
    'element vertex '+n+'\nproperty float x\nproperty float y\nproperty float z\n'+
    'property uchar red\nproperty uchar green\nproperty uchar blue\n'+
    'element edge '+m+'\nproperty int vertex1\nproperty int vertex2\nend_header\n';
  for(let i=0;i<n;i++){
    const o=i*3;
    s+=c.pos[o].toFixed(5)+' '+c.pos[o+1].toFixed(5)+' '+c.pos[o+2].toFixed(5)+' '+
       Math.round(c.col[o]*255)+' '+Math.round(c.col[o+1]*255)+' '+Math.round(c.col[o+2]*255)+'\n';
  }
  for(let i=0;i<c.edges.length;i+=2) s+=c.edges[i]+' '+c.edges[i+1]+'\n';
  return s;
}
// OBJ: v з xyzrgb-розширенням + l-лінії (1-індексація)
function writeOBJ(c){
  let s='o axiom_cloud\n';
  const n=c.pos.length/3;
  for(let i=0;i<n;i++){
    const o=i*3;
    s+='v '+c.pos[o].toFixed(5)+' '+c.pos[o+1].toFixed(5)+' '+c.pos[o+2].toFixed(5)+' '+
       c.col[o].toFixed(3)+' '+c.col[o+1].toFixed(3)+' '+c.col[o+2].toFixed(3)+'\n';
  }
  for(let i=0;i<c.edges.length;i+=2) s+='l '+(c.edges[i]+1)+' '+(c.edges[i+1]+1)+'\n';
  return s;
}
// GLB: бінарний glTF 2.0, POINTS + LINES, COLOR_0, uint16-індекси
function writeGLB(c){
  const n=c.pos.length/3;
  const pos=new Float32Array(c.pos), col=new Float32Array(c.col), idx=new Uint16Array(c.edges);
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<n;i++) for(let k=0;k<3;k++){
    const v=pos[i*3+k]; if(v<mn[k])mn[k]=v; if(v>mx[k])mx[k]=v;
  }
  if(!n){ mn.fill(0); mx.fill(0); }
  const pad4=x=>(4-x%4)%4;
  const bPos=pos.byteLength, bCol=col.byteLength, bIdx=idx.byteLength;
  const binLen=bPos+bCol+bIdx+pad4(bIdx);
  const json={ asset:{version:"2.0",generator:"AXIOM"}, scene:0, scenes:[{nodes:[0]}],
    nodes:[{mesh:0,name:"axiom_cloud"}],
    meshes:[{primitives:[
      {attributes:{POSITION:0,COLOR_0:1},mode:0},
      {attributes:{POSITION:0,COLOR_0:1},indices:2,mode:1}]}],
    buffers:[{byteLength:binLen}],
    bufferViews:[
      {buffer:0,byteOffset:0,byteLength:bPos},
      {buffer:0,byteOffset:bPos,byteLength:bCol},
      {buffer:0,byteOffset:bPos+bCol,byteLength:bIdx}],
    accessors:[
      {bufferView:0,componentType:5126,count:n,type:"VEC3",min:mn,max:mx},
      {bufferView:1,componentType:5126,count:n,type:"VEC3"},
      {bufferView:2,componentType:5123,count:idx.length,type:"SCALAR"}] };
  let js=JSON.stringify(json);
  js+=' '.repeat(pad4(js.length));
  const total=12+8+js.length+8+binLen;
  const buf=new ArrayBuffer(total), dv=new DataView(buf), u8=new Uint8Array(buf);
  let o=0;
  dv.setUint32(o,0x46546C67,true); o+=4;
  dv.setUint32(o,2,true); o+=4;
  dv.setUint32(o,total,true); o+=4;
  dv.setUint32(o,js.length,true); o+=4;
  dv.setUint32(o,0x4E4F534A,true); o+=4;
  for(let i=0;i<js.length;i++) u8[o+i]=js.charCodeAt(i);
  o+=js.length;
  dv.setUint32(o,binLen,true); o+=4;
  dv.setUint32(o,0x004E4942,true); o+=4;
  u8.set(new Uint8Array(pos.buffer),o); o+=bPos;
  u8.set(new Uint8Array(col.buffer),o); o+=bCol;
  u8.set(new Uint8Array(idx.buffer),o);
  return buf;
}
// bbox плоского масиву [x,y,z,...] -> {mn,mx} або null
function bboxOf(flat){
  if(!flat.length) return null;
  const mn=[Infinity,Infinity,Infinity], mx=[-Infinity,-Infinity,-Infinity];
  for(let i=0;i<flat.length;i+=3) for(let k=0;k<3;k++){
    const v=flat[i+k]; if(v<mn[k])mn[k]=v; if(v>mx[k])mx[k]=v;
  }
  return { mn, mx };
}
// Фіт: центр bbox + масштаб до цільового пів-розміру (кламп 0.5–12)
function fitFromBbox(mn,mx,target){
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  const ext=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2;
  const s=Math.min(12,Math.max(0.5,target/(ext||1e-6)));
  return { c, s };
}

// ── НЕЙРОНКИ: 5 штук, паралельно, з індивідуальним фолбеком ──
async function initVision(){
  const mp=await import(`${CDN}/vision_bundle.mjs`);
  const { FilesetResolver, FaceLandmarker, GestureRecognizer, PoseLandmarker,
          ImageSegmenter, ObjectDetector }=mp;
  const fs=await FilesetResolver.forVisionTasks(`${CDN}/wasm`);
  bump('WASM на місці. Тягну п\u02BCять моделей…',8);

  TESS=FaceLandmarker.FACE_LANDMARKS_TESSELATION;
  REYE=FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE;
  LEYE=FaceLandmarker.FACE_LANDMARKS_LEFT_EYE;
  RIRIS=FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS;
  LIRIS=FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS;
  HCONN=GestureRecognizer.HAND_CONNECTIONS;
  PCONN=PoseLandmarker.POSE_CONNECTIONS;
  REYE_IDX=uniqIdx(REYE); LEYE_IDX=uniqIdx(LEYE);
  RIRIS_IDX=uniqIdx(RIRIS); LIRIS_IDX=uniqIdx(LIRIS);

  const mk=async (Cls,model,extra)=>{
    const o=d=>({ baseOptions:{ modelAssetPath:model, delegate:d }, runningMode:'VIDEO', ...extra });
    try{ return await Cls.createFromOptions(fs,o('GPU')); }
    catch(e){ return await Cls.createFromOptions(fs,o('CPU')); }
  };
  const jobs=[
    ['face', ()=>mk(FaceLandmarker,`${MODELS}/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
        { numFaces:1, outputFaceBlendshapes:true, outputFacialTransformationMatrixes:true }),
      'Лице на місці', v=>FL=v],
    ['gest', ()=>mk(GestureRecognizer,`${MODELS}/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task`,
        { numHands:2 }),
      'Жести під\u02BCїхали', v=>GR=v],
    ['pose', ()=>mk(PoseLandmarker,`${MODELS}/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`,
        { numPoses:1 }),
      'Поза в строю', v=>PL=v],
    ['seg', ()=>mk(ImageSegmenter,`${MODELS}/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.task`,
        { outputConfidenceMasks:true, outputCategoryMask:false }),
      'Сегментація тут', v=>SG=v],
    ['obj', ()=>mk(ObjectDetector,`${MODELS}/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.task`,
        { scoreThreshold:0.3, maxResults:8 }),
      'Об\u02BCєкти бачу', v=>OD=v]
  ];
  const res=await Promise.allSettled(jobs.map(async ([name,make,msg,set])=>{
    const inst=await make(); set(inst); bump(msg,13); return name;
  }));
  res.forEach((r,i)=>{ if(r.status==='rejected') dead[jobs[i][0]]=true; });
}

// ── ПЛАНУВАЛЬНИК: зважений round-robin по активних ────
const WEIGHTS={ face:2, gest:2, pose:1, seg:1, obj:1 };
const HAS={ face:()=>FL, gest:()=>GR, pose:()=>PL, seg:()=>SG, obj:()=>OD };
function rebuildQueue(){
  const items=Object.keys(layer).filter(k=>layer[k]&&HAS[k]()).map(k=>[k,WEIGHTS[k]]);
  const key=items.map(i=>i[0]).join(',');
  if(key!==queueKey){ queueKey=key; queue=items.length?buildQueue(items):[]; }
}

// ── ЦИКЛ ───────────────────────────────────────────────
const useRVFC='requestVideoFrameCallback' in HTMLVideoElement.prototype;
function schedule(){
  if(!running) return;
  if(useRVFC) vid.requestVideoFrameCallback(onFrame);
  else requestAnimationFrame(onFrame);
}
function onFrame(){
  const now=performance.now();
  if(vid.readyState>=2 && vid.videoWidth){
    frameNo++;
    rebuildQueue();
    if(queue.length){
      const w=queue[frameNo%queue.length];
      try{ dispatch(w,now); }catch(_){}
    }
    if(!mode3d) draw(now);
    const dt=(now-lastT)||1; lastT=now;
    fpsV = fpsV ? fpsV*0.9+(1000/dt)*0.1 : 1000/dt;
    if(now-lastFpsUpd>300){
      const f=Math.round(fpsV);
      fpsTxt=f+' fps';
      fpsCol = f<15?RED : f<24?AMBER : ACC_D;
      lastFpsUpd=now;
    }
  }
  schedule();
}
function dispatch(w,now){
  if(w==='face'){ faceRes=FL.detectForVideo(vid,now); postFace(now); }
  else if(w==='gest'){ gestRes=GR.recognizeForVideo(vid,now); postGest(now); }
  else if(w==='pose'){ poseRes=PL.detectForVideo(vid,now); }
  else if(w==='seg'){ const r=SG.segmentForVideo(vid,now); postSeg(r); }
  else if(w==='obj'){ objRes=OD.detectForVideo(vid,now); }
}

// ── ПОСТ-ОБРОБКА: ЛИЦЕ (міміка, поза, ірис) ───────────
const ema=(o,v,k=0.3)=>o+(v-o)*k;
function bsMap(cats){ const m={}; for(const c of cats) m[c.categoryName]=c.score; return m; }
function postFace(){
  const lms=faceRes&&faceRes.faceLandmarks;
  if(!lms||!lms.length){ hasPose=false; hasDist=false; gazeL=gazeR=null; return; }
  // Блендшейпи -> 5 метрів
  const bsl=faceRes.faceBlendshapes;
  if(bsl&&bsl.length){
    const b=bsMap(bsl[0].categories);
    const g=n=>b[n]||0;
    meters.smile =ema(meters.smile ,(g('mouthSmileLeft')+g('mouthSmileRight'))/2);
    meters.brow  =ema(meters.brow  ,Math.max(g('browInnerUp'),(g('browOuterUpLeft')+g('browOuterUpRight'))/2));
    meters.squint=ema(meters.squint,(g('eyeSquintLeft')+g('eyeSquintRight'))/2);
    meters.jaw   =ema(meters.jaw   ,g('jawOpen'));
    const bl=(g('eyeBlinkLeft')+g('eyeBlinkRight'))/2;
    meters.blink =ema(meters.blink ,bl,0.5);
    if(!blinkClosed && bl>0.55){ blinkClosed=true; blinkCount++; }
    else if(blinkClosed && bl<0.35) blinkClosed=false;
  }
  // Матриця -> компас
  const mats=faceRes.facialTransformationMatrixes;
  if(mats&&mats.length&&mats[0].data){
    const e=eulerFromMat(mats[0].data);
    yawS=ema(yawS,e.yaw); pitchS=ema(pitchS,e.pitch); rollS=ema(rollS,e.roll);
    hasPose=true;
  } else hasPose=false;
  // Ірис -> дистанція + погляд
  const lm=lms[0], vw=vid.videoWidth, vh=vid.videoHeight;
  const eye=(eyeIdx,irisIdx)=>{
    let minx=1,maxx=0,miny=1,maxy=0;
    for(const i of eyeIdx){ const p=lm[i];
      if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x;
      if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y; }
    let cx=0,cy=0;
    for(const i of irisIdx){ cx+=lm[i].x; cy+=lm[i].y; }
    cx/=irisIdx.length; cy/=irisIdx.length;
    let d=0;
    for(let a=0;a<irisIdx.length;a++) for(let b2=a+1;b2<irisIdx.length;b2++){
      const p=lm[irisIdx[a]], q=lm[irisIdx[b2]];
      const dx=(p.x-q.x)*vw, dy=(p.y-q.y)*vh;
      const dd=Math.hypot(dx,dy); if(dd>d)d=dd;
    }
    return { ex:(minx+maxx)/2, ey:(miny+maxy)/2, cx, cy, diam:d };
  };
  const R=eye(REYE_IDX,RIRIS_IDX), L=eye(LEYE_IDX,LIRIS_IDX);
  const diam=(R.diam+L.diam)/2;
  if(diam>2){
    const fpx=0.5*vw/Math.tan(Math.PI/6);        // ~60° HFOV, оцінка
    distS=ema(distS,fpx*1.17/diam,0.2); hasDist=true;
  } else hasDist=false;
  gazeR={ cx:R.cx, cy:R.cy, dx:R.cx-R.ex, dy:R.cy-R.ey };
  gazeL={ cx:L.cx, cy:L.cy, dx:L.cx-L.ex, dy:L.cy-L.ey };
}

// ── ПОСТ-ОБРОБКА: ЖЕСТИ (пінч-пензель, hold-дії) ──────
function postGest(now){
  const hands=gestRes&&gestRes.landmarks?gestRes.landmarks:[];
  if(!mode3d && vid.videoWidth){
    const { dw,dh,ox,oy }=coverMap(vid.videoWidth,vid.videoHeight,W,H);
    for(let h=0;h<2;h++){
      const s=pinch[h];
      if(h>=hands.length){ s.on=false; continue; }
      const lm=hands[h];
      const scale=Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y)||1e-6;
      const r=Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y)/scale;
      const want = s.on ? r<0.45 : r<0.35;       // гістерезис
      let px=ox+((lm[4].x+lm[8].x)/2)*dw;
      const py=oy+((lm[4].y+lm[8].y)/2)*dh;
      if(mirrored) px=W-px;
      if(want){
        if(!s.on){ s.on=true; s.x=px; s.y=py; }
        else{
          if(h===0){                              // рука 0 — пензель
            inkX.globalCompositeOperation='source-over';
            inkX.strokeStyle='rgba(255,193,60,.25)'; inkX.lineWidth=10;
            inkX.beginPath(); inkX.moveTo(s.x,s.y); inkX.lineTo(px,py); inkX.stroke();
            inkX.strokeStyle=AMBER; inkX.lineWidth=3.5;
            inkX.beginPath(); inkX.moveTo(s.x,s.y); inkX.lineTo(px,py); inkX.stroke();
          }else{                                  // рука 1 — ластик
            inkX.globalCompositeOperation='destination-out';
            inkX.beginPath(); inkX.arc(px,py,26,0,6.2832); inkX.fill();
            inkX.globalCompositeOperation='source-over';
          }
          s.x=px; s.y=py;
        }
      } else s.on=false;
    }
  }
  // Hold-жести: долоня 1.2с = стерти, victory 1.2с = 3D
  let top='';
  const gs=gestRes&&gestRes.gestures?gestRes.gestures:[];
  for(const g of gs){ if(g.length&&g[0].score>0.6){ top=g[0].categoryName; break; } }
  if(top==='Open_Palm'||top==='Victory'){
    if(holdName!==top){ holdName=top; holdSince=now; }
    else if(now-holdSince>1200 && now-lastFire>1800){
      lastFire=now;
      if(top==='Open_Palm'){ clearInk(); toast('Стерто. Як не було.'); }
      else setMode(!mode3d);
    }
  } else holdName='';
}
function clearInk(){
  inkX.save(); inkX.setTransform(1,0,0,1,0,0);
  inkX.clearRect(0,0,ink.width,ink.height);
  inkX.restore();
}

// ── ПОСТ-ОБРОБКА: СЕГМЕНТАЦІЯ ─────────────────────────
const mcv=document.createElement('canvas'), mcX=mcv.getContext('2d');
function postSeg(res){
  try{
    const masks=res&&res.confidenceMasks;
    if(!masks||!masks.length){ segCache=null; return; }
    const m=masks[masks.length-1];               // особа — останній клас
    const mw=m.width, mh=m.height;
    const arr=m.getAsFloat32Array();
    const stride=Math.max(1,Math.ceil(mw/192));
    const gw=Math.floor((mw-1)/stride)+1, gh=Math.floor((mh-1)/stride)+1;
    const grid=new Float32Array(gw*gh);
    for(let y=0;y<gh;y++){ const sy=y*stride*mw;
      for(let x=0;x<gw;x++) grid[y*gw+x]=arr[sy+x*stride]; }
    // Альфа-маска -> mcv
    if(mcv.width!==gw||mcv.height!==gh){ mcv.width=gw; mcv.height=gh; }
    const img=mcX.createImageData(gw,gh), px=img.data;
    for(let i=0;i<grid.length;i++){
      const a=Math.max(0,Math.min(1,grid[i]));
      const o=i*4; px[o]=255; px[o+1]=255; px[o+2]=255; px[o+3]=(a*255)|0;
    }
    mcX.putImageData(img,0,0);
    segCache={ segs:marchingSquares(grid,gw,gh,0.5), gw, gh };
    for(const mm of masks){ try{ mm.close(); }catch(_){} }
  }catch(_){ segCache=null; }
}

// ── 2D РЕНДЕР ──────────────────────────────────────────
function strokeConn(lm,conns,color,w,ox,oy,dw,dh){
  ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath();
  for(let i=0;i<conns.length;i++){
    const c=conns[i], a=lm[c.start], b=lm[c.end];
    ctx.moveTo(ox+a.x*dw, oy+a.y*dh);
    ctx.lineTo(ox+b.x*dw, oy+b.y*dh);
  }
  ctx.stroke();
}
function dots(lm,color,r,ox,oy,dw,dh){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(const p of lm){
    const x=ox+p.x*dw, y=oy+p.y*dh;
    ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832);
  }
  ctx.fill();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw||!vh) return;
  const { s,dw,dh,ox,oy }=coverMap(vw,vh,W,H);

  ctx.save();
  if(mirrored){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.lineCap='round'; ctx.lineJoin='round';

  // 1. Сегментація: глушимо фон, світлимо людину, неон-контур
  if(layer.seg && segCache){
    if(cfg.dim){
    ctx.fillStyle='rgba(0,18,11,0.45)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='destination-out';
    ctx.drawImage(mcv,ox,oy,dw,dh);              // виріз по масці
    ctx.globalCompositeOperation='source-over';
    // людина: сире відео (без CSS-фільтра) крізь маску, пригашене до ~55%
    pcX.setTransform(1,0,0,1,0,0);
    pcX.clearRect(0,0,pcv.width,pcv.height);
    const k=pcv.width/W;
    pcX.drawImage(vid,ox*k,oy*k,dw*k,dh*k);
    pcX.globalCompositeOperation='destination-in';
    pcX.drawImage(mcv,ox*k,oy*k,dw*k,dh*k);
    pcX.globalCompositeOperation='source-atop';
    pcX.fillStyle='rgba(0,4,2,0.45)';
    pcX.fillRect(0,0,pcv.width,pcv.height);
    pcX.globalCompositeOperation='source-over';
    ctx.drawImage(pcv,0,0,W,H);
    }
    // контур
    if(cfg.edge){
    const sc=segCache, kx=dw/(sc.gw-1), ky=dh/(sc.gh-1);
    ctx.strokeStyle=ACC; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<sc.segs.length;i+=4){
      ctx.moveTo(ox+sc.segs[i]*kx,   oy+sc.segs[i+1]*ky);
      ctx.lineTo(ox+sc.segs[i+2]*kx, oy+sc.segs[i+3]*ky);
    }
    ctx.stroke();
    }
  }

  // 2. Поза
  if(layer.pose && poseRes && poseRes.landmarks){
    for(const lm of poseRes.landmarks){
      strokeConn(lm,PCONN,'rgba(106,213,130,.5)',2,ox,oy,dw,dh);
      dots(lm,'rgba(106,213,130,.7)',2.5,ox,oy,dw,dh);
    }
  }

  // 3. Лице
  if(layer.face && faceRes && faceRes.faceLandmarks){
    for(const lm of faceRes.faceLandmarks){
      if(cfg.tessOn) strokeConn(lm,TESS,'rgba(106,213,130,'+cfg.ta+')',0.6,ox,oy,dw,dh);
      strokeConn(lm,REYE,ACC,1.5*cfg.lw,ox,oy,dw,dh);
      strokeConn(lm,LEYE,ACC,1.5*cfg.lw,ox,oy,dw,dh);
      strokeConn(lm,INNER_LIPS,ACC,1.5*cfg.lw,ox,oy,dw,dh);
    }
  }

  // 4. Руки (з GestureRecognizer)
  if(layer.gest && gestRes && gestRes.landmarks){
    for(const lm of gestRes.landmarks){
      strokeConn(lm,HCONN,ACC,2*cfg.lw,ox,oy,dw,dh);
      dots(lm,AMBER,3,ox,oy,dw,dh);
    }
  }
  ctx.restore();

  // ── далі екранний простір (без дзеркала) ──
  ctx.drawImage(ink,0,0,W,H);                    // air-draw чорнило

  // 5. Об'єкти: рамки-кутники + укр лейбли
  if(layer.obj && objRes && objRes.detections){
    ctx.lineWidth=1.5; ctx.font=`9px ${FONT}`; ctx.textAlign='left';
    for(const d of objRes.detections){
      const bb=d.boundingBox; if(!bb) continue;
      const c0=d.categories&&d.categories[0]; if(!c0) continue;
      if(c0.score<cfg.thr) continue;
      let x=ox+bb.originX*s;
      const y=oy+bb.originY*s, w=bb.width*s, h=bb.height*s;
      if(mirrored) x=W-(x+w);
      const cl=Math.min(14,w*0.3,h*0.3);
      ctx.strokeStyle=ACC;
      ctx.beginPath();
      [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([qx,qy,sx,sy])=>{
        ctx.moveTo(qx+sx*cl,qy); ctx.lineTo(qx,qy); ctx.lineTo(qx,qy+sy*cl);
      });
      ctx.stroke();
      const name=UA[c0.categoryName]||(c0.categoryName||'').toUpperCase();
      const label=`${name} ${Math.round(c0.score*100)}`;
      const tw=ctx.measureText(label).width;
      ctx.fillStyle='rgba(13,59,37,.85)';
      ctx.fillRect(x,y-15,tw+10,13);
      ctx.fillStyle=AMBER;
      ctx.fillText(label,x+5,y-5);
    }
  }

  // 6. Погляд з очей
  if(cfg.gaze && layer.face && gazeL && gazeR){
    ctx.strokeStyle='rgba(255,193,60,.9)'; ctx.lineWidth=1.5;
    for(const g of [gazeL,gazeR]){
      let x=ox+g.cx*dw; const y=oy+g.cy*dh;
      let dx=g.dx*dw; const dy=g.dy*dh;
      if(mirrored){ x=W-x; dx=-dx; }
      const m=Math.hypot(dx,dy)||1e-6;
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+dx/m*30, y+dy/m*30);
      ctx.stroke();
    }
  }

  // 7. HUD: бари міміки (зліва)
  if(layer.face && faceRes && faceRes.faceLandmarks && faceRes.faceLandmarks.length){
    if(cfg.bars){
    const rows=[['УСМІХ',meters.smile],['БРОВИ',meters.brow],['ПРИЖМ',meters.squint],
                ['РОТ',meters.jaw],['КЛІП',meters.blink]];
    let y=56;
    ctx.font=`7px ${FONT}`; ctx.textAlign='left';
    for(const [lb,v] of rows){
      ctx.fillStyle=ACC_D; ctx.fillText(lb,12,y-3);
      ctx.fillStyle='rgba(106,213,130,.15)'; ctx.fillRect(12,y,88,4);
      ctx.fillStyle=v>0.6?AMBER:ACC; ctx.fillRect(12,y,88*Math.min(1,v),4);
      y+=24;
    }
    ctx.fillStyle=ACC_D; ctx.fillText(`КЛІПАНЬ: ${blinkCount}`,12,y+2);
    }

    // 8. Компас голови (справа)
    if(cfg.poseHud && hasPose){
      const cx=W-46, cy=64, r=25;
      ctx.strokeStyle='rgba(106,213,130,.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.stroke();
      for(let a=0;a<12;a++){
        const t=a*Math.PI/6;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(t)*(r-3),cy+Math.sin(t)*(r-3));
        ctx.lineTo(cx+Math.cos(t)*r,cy+Math.sin(t)*r);
        ctx.stroke();
      }
      ctx.save();                                 // штучний горизонт: roll+pitch
      ctx.translate(cx,cy); ctx.rotate(rollS);
      const po=Math.max(-18,Math.min(18,pitchS*40));
      ctx.strokeStyle=ACC; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-r+6,po); ctx.lineTo(r-6,po); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle=AMBER; ctx.lineWidth=1.5;   // yaw-стрілка
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.sin(yawS)*(r-6), cy-Math.cos(yawS)*(r-6));
      ctx.stroke();
      const dg=v=>{ const d=Math.round(v*180/Math.PI); return (d>=0?'+':'')+d; };
      ctx.font=`6px ${FONT}`; ctx.textAlign='right'; ctx.fillStyle=ACC_D;
      ctx.fillText('ПОЗА ГОЛОВИ',W-12,cy-r-8);
      ctx.font=`7px ${FONT}`;
      ctx.fillText(`Y${dg(yawS)} P${dg(pitchS)} R${dg(rollS)}`,W-12,cy+r+12);
      if(hasDist){
        ctx.fillStyle=AMBER; ctx.font=`9px ${FONT}`;
        ctx.fillText(`ДИСТ ~${Math.round(distS)} СМ`,W-12,cy+r+27);
      }
    }
  }

  // 9. FPS у куті канваса
  ctx.font=`10px ${FONT}`; ctx.textAlign='left';
  ctx.fillStyle='rgba(0,18,11,.55)';
  ctx.fillRect(8,8,52,14);
  ctx.fillStyle=fpsCol;
  ctx.fillText(fpsTxt,12,19);
}

// ── 3D РЕЖИМ ───────────────────────────────────────────
let THREE=null, scene=null, geo3={};
const orbit={ th:0, ph:1.15, r:1.9, vth:0, vph:0 };
const c3=[0,0,0]; let s3=1;                        // фіт: центр + масштаб
let frozen=null, grid3=null;                       // фріз-знімок, сітка-підлога
let fly=false, flyPos=null, flyYaw=0, flyPitch=0;
let joyId=-1, joyOx=0, joyOy=0, joyVx=0, joyVy=0, lookId=-1;
let orbN=0, t3last=0;
let v3a=null, v3b=null, eulT=null;
const joyEl=$('joy'), knob=$('knob');
function showJoy(x,y){ joyEl.style.left=x+'px'; joyEl.style.top=y+'px'; joyEl.style.display='block'; }
function hideJoy(){ joyEl.style.display='none'; knob.style.transform='translate(-50%,-50%)'; }
function applyPt(){
  if(!THREE) return;
  geo3.faceP.material.size=0.013*cfg.pt;
  geo3.handP.material.size=0.02*cfg.pt;
  geo3.poseP.material.size=0.022*cfg.pt;
}

async function init3D(){
  THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  renderer=new THREE.WebGLRenderer({ canvas:glc, antialias:false });
  renderer.setPixelRatio(DPR);
  renderer.setSize(W,H,false);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x00120b);
  cam3=new THREE.PerspectiveCamera(50,W/H,0.01,50);
  cam3.rotation.order='YXZ';
  v3a=new THREE.Vector3(); v3b=new THREE.Vector3(); eulT=new THREE.Euler(0,0,0,'YXZ');
  grid3=new THREE.GridHelper(3,12,0x0d3b25,0x0d3b25);
  grid3.translateY(-0.9); grid3.visible=cfg.grid;
  scene.add(grid3);
  const mkLines=(n,color,op)=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
    const o=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
    o.frustumCulled=false; scene.add(o); return o;
  };
  const mkPts=(n,color,size,op)=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
    const o=new THREE.Points(g,new THREE.PointsMaterial({color,size,transparent:true,opacity:op}));
    o.frustumCulled=false; scene.add(o); return o;
  };
  geo3.faceL=mkLines(TESS.length*2,0x6AD582,0.3);
  geo3.faceP=mkPts(478,0x6AD582,0.013,0.9);
  geo3.handL=mkLines(HCONN.length*2*2,0xFFC13C,0.9);
  geo3.handP=mkPts(42,0xFFC13C,0.02,0.95);
  geo3.poseL=mkLines(PCONN.length*2,0x6AD582,0.45);
  geo3.poseP=mkPts(33,0x6AD582,0.022,0.6);
  applyPt();
  // Вказівники: орбіта (драг+щипок+інерція) / політ (джойстик+огляд)
  const ptr=new Map(), downs=new Map();
  let pd=0, lastTap=0, lastTapX=0, lastTapY=0;
  glc.addEventListener('pointerdown',e=>{
    glc.setPointerCapture(e.pointerId);
    downs.set(e.pointerId,{t:performance.now(),x:e.clientX,y:e.clientY});
    if(fly){
      if(e.clientX<W/2 && joyId<0){
        joyId=e.pointerId; joyOx=e.clientX; joyOy=e.clientY;
        joyVx=joyVy=0; showJoy(e.clientX,e.clientY);
      } else if(lookId<0){
        lookId=e.pointerId; ptr.set(e.pointerId,[e.clientX,e.clientY]);
      }
    } else {
      ptr.set(e.pointerId,[e.clientX,e.clientY]); orbN=ptr.size;
      orbit.vth=orbit.vph=0;
    }
  });
  glc.addEventListener('pointermove',e=>{
    if(fly){
      if(e.pointerId===joyId){
        let dx=e.clientX-joyOx, dy=e.clientY-joyOy;
        const ml=Math.hypot(dx,dy), mx=44;
        if(ml>mx){ dx=dx/ml*mx; dy=dy/ml*mx; }
        joyVx=dx/mx; joyVy=dy/mx;
        knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      } else if(e.pointerId===lookId && ptr.has(e.pointerId)){
        const pv=ptr.get(e.pointerId);
        ptr.set(e.pointerId,[e.clientX,e.clientY]);
        flyYaw-=(e.clientX-pv[0])*0.004;
        flyPitch=Math.max(-1.45,Math.min(1.45,flyPitch-(e.clientY-pv[1])*0.004));
      }
      return;
    }
    if(!ptr.has(e.pointerId)) return;
    const pv=ptr.get(e.pointerId);
    ptr.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptr.size===1){
      const dx=e.clientX-pv[0], dy=e.clientY-pv[1];
      orbit.th-=dx*0.006;
      orbit.ph=Math.max(0.15,Math.min(3.0,orbit.ph-dy*0.006));
      orbit.vth=-dx*0.006; orbit.vph=-dy*0.006;
    }else if(ptr.size===2){
      const ps=[...ptr.values()];
      const nd=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);
      if(pd>0) orbit.r=Math.max(0.25,Math.min(8,orbit.r*pd/nd));
      pd=nd;
    }
  });
  const up=e=>{
    const d=downs.get(e.pointerId); downs.delete(e.pointerId);
    if(d && performance.now()-d.t<250 && Math.hypot(e.clientX-d.x,e.clientY-d.y)<12){
      const tn=performance.now();
      if(tn-lastTap<330 && Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<40){ resetCam(); lastTap=0; }
      else { lastTap=tn; lastTapX=e.clientX; lastTapY=e.clientY; }
    }
    if(e.pointerId===joyId){ joyId=-1; joyVx=joyVy=0; hideJoy(); }
    if(e.pointerId===lookId) lookId=-1;
    ptr.delete(e.pointerId);
    if(ptr.size<2) pd=0;
    orbN=ptr.size;
  };
  glc.addEventListener('pointerup',up);
  glc.addEventListener('pointercancel',up);
}
function resetCam(){
  if(fly) setFly(false,true);
  orbit.th=0; orbit.ph=1.15; orbit.r=1.9; orbit.vth=orbit.vph=0;
  toast('Камера скинута.');
}
function setFly(on,silent){
  fly=on;
  const b=$('b-dive');
  b.querySelector('span').textContent=on?'Виринути':'Пірнути';
  b.classList.toggle('on',on);
  if(on){
    flyPos=cam3.position.clone();
    cam3.lookAt(0,0,0);
    flyYaw=cam3.rotation.y; flyPitch=cam3.rotation.x;
    if(!silent) toast('Пірнув. Ліво — хід, право — огляд.');
  }else{
    joyId=-1; lookId=-1; joyVx=joyVy=0; hideJoy();
    const p=cam3.position, r=Math.max(0.25,p.length());
    orbit.r=Math.min(8,r);
    orbit.ph=Math.acos(Math.max(-1,Math.min(1,p.y/r)));
    orbit.th=Math.atan2(p.x,p.z);
    orbit.vth=orbit.vph=0;
    if(!silent) toast('Винирнув.');
  }
}
function map3(p,a,out,o){
  const m=mapPt(p,a,mirrored);
  out[o]=(m[0]-c3[0])*s3; out[o+1]=(m[1]-c3[1])*s3; out[o+2]=(m[2]-c3[2])*s3;
}
function fillLines(obj,lm,conns,a){
  const arr=obj.geometry.attributes.position.array;
  let o=0;
  for(const c of conns){ map3(lm[c.start],a,arr,o); o+=3; map3(lm[c.end],a,arr,o); o+=3; }
  obj.geometry.setDrawRange(0,o/3);
  obj.geometry.attributes.position.needsUpdate=true;
  obj.visible=true;
}
function fillPts(obj,lms,a){
  const arr=obj.geometry.attributes.position.array;
  let o=0;
  for(const lm of lms) for(const p of lm){ map3(p,a,arr,o); o+=3; }
  obj.geometry.setDrawRange(0,o/3);
  obj.geometry.attributes.position.needsUpdate=true;
  obj.visible=o>0;
}
function upd3(dt){
  const a=(vid.videoWidth||640)/(vid.videoHeight||480);
  const fl=layer.face&&faceRes&&faceRes.faceLandmarks&&faceRes.faceLandmarks.length?faceRes.faceLandmarks:null;
  const hl=layer.gest&&gestRes&&gestRes.landmarks&&gestRes.landmarks.length?gestRes.landmarks:null;
  const pl=layer.pose&&poseRes&&poseRes.landmarks&&poseRes.landmarks.length?poseRes.landmarks:null;
  // Авто-фіт: якір — лице; фолбек — все видиме. Рука лице більше не рухає.
  if(!frozen){
    const flat=[];
    const push=ls=>{ for(const lm of ls) for(const p of lm){ const m=mapPt(p,a,mirrored); flat.push(m[0],m[1],m[2]); } };
    if(fl) push([fl[0]]);
    else { if(hl) push(hl); if(pl) push([pl[0]]); }
    const bb=bboxOf(flat);
    if(bb){
      const f=fitFromBbox(bb.mn,bb.mx,0.55), k=0.2;
      c3[0]+=(f.c[0]-c3[0])*k; c3[1]+=(f.c[1]-c3[1])*k; c3[2]+=(f.c[2]-c3[2])*k;
      s3+=(f.s-s3)*k;
    }
  }
  if(!frozen){
  if(fl){ fillLines(geo3.faceL,fl[0],TESS,a); fillPts(geo3.faceP,[fl[0]],a); }
  else geo3.faceL.visible=geo3.faceP.visible=false;
  if(hl){
    const arr=geo3.handL.geometry.attributes.position.array;
    let o=0;
    for(const lm of hl) for(const c of HCONN){ map3(lm[c.start],a,arr,o); o+=3; map3(lm[c.end],a,arr,o); o+=3; }
    geo3.handL.geometry.setDrawRange(0,o/3);
    geo3.handL.geometry.attributes.position.needsUpdate=true;
    geo3.handL.visible=true;
    fillPts(geo3.handP,hl,a);
  } else geo3.handL.visible=geo3.handP.visible=false;
  if(pl){ fillLines(geo3.poseL,pl[0],PCONN,a); fillPts(geo3.poseP,[pl[0]],a); }
  else geo3.poseL.visible=geo3.poseP.visible=false;
  }
  if(fly){
    eulT.set(flyPitch,flyYaw,0,'YXZ');
    v3a.set(0,0,-1).applyEuler(eulT);
    v3b.set(1,0,0).applyEuler(eulT);
    flyPos.addScaledVector(v3a,-joyVy*cfg.fs*dt);
    flyPos.addScaledVector(v3b, joyVx*cfg.fs*dt);
    cam3.position.copy(flyPos);
    cam3.rotation.set(flyPitch,flyYaw,0);
  }else{
    if(orbN===0){                                  // інерція вибігу
      orbit.th+=orbit.vth;
      orbit.ph=Math.max(0.15,Math.min(3.0,orbit.ph+orbit.vph));
      orbit.vth*=0.93; orbit.vph*=0.93;
      if(Math.abs(orbit.vth)<1e-4) orbit.vth=0;
      if(Math.abs(orbit.vph)<1e-4) orbit.vph=0;
    }
    cam3.position.set(
      orbit.r*Math.sin(orbit.ph)*Math.sin(orbit.th),
      orbit.r*Math.cos(orbit.ph),
      orbit.r*Math.sin(orbit.ph)*Math.cos(orbit.th));
    cam3.lookAt(0,0,0);
  }
}
function loop3(){
  if(!mode3d) return;
  const tn=performance.now();
  const dt=t3last?Math.min(0.05,(tn-t3last)/1000):0.016;
  t3last=tn;
  upd3(dt);
  renderer.render(scene,cam3);
  requestAnimationFrame(loop3);
}
let threeLoading=false;
async function setMode(m3){
  if(m3===mode3d) return;
  if(m3){
    if(threeLoading) return;
    if(!THREE){
      threeLoading=true;
      try{ await init3D(); }
      catch(_){ threeLoading=false; toast('Three.js не доїхав. Мережа, ти шо.'); return; }
      threeLoading=false;
    }
    mode3d=true;
    document.body.classList.add('m3');
    t3last=0;
    loop3();
    toast('3D. Драг — орбіта, щипок — зум, 2 тапи — скидання.');
  }else{
    mode3d=false;
    if(fly) setFly(false,true);
    setFrozen(false,true);
    hideJoy();
    expop.classList.remove('open');
    document.body.classList.remove('m3');
  }
  $('m-efir').classList.toggle('on',!mode3d);
  $('m-3d').classList.toggle('on',mode3d);
}
function setFrozen(on,silent){
  if(on&&!frozen){
    frozen={ cloud: collectCloud() };
    $('b-freeze').classList.add('on');
    if(!silent) toast('Фріз. Хмара стоїть.');
  }else if(!on&&frozen){
    frozen=null;
    $('b-freeze').classList.remove('on');
    if(!silent) toast('Розморозив.');
  }
}

// ── ЕКСПОРТ ХМАРИ: PLY / OBJ / GLB ────────────────────
function collectCloud(){
  const a=(vid.videoWidth||640)/(vid.videoHeight||480);
  const ents=[];
  const fl=layer.face&&faceRes&&faceRes.faceLandmarks&&faceRes.faceLandmarks.length?faceRes.faceLandmarks:null;
  const hl=layer.gest&&gestRes&&gestRes.landmarks&&gestRes.landmarks.length?gestRes.landmarks:null;
  const pl=layer.pose&&poseRes&&poseRes.landmarks&&poseRes.landmarks.length?poseRes.landmarks:null;
  if(fl) ents.push({ lms:[fl[0]], conns:TESS,  color:[0.416,0.835,0.510] });
  if(hl) ents.push({ lms:hl,      conns:HCONN, color:[1,0.757,0.235] });
  if(pl) ents.push({ lms:[pl[0]], conns:PCONN, color:[0.29,0.55,0.36] });
  return buildCloud(ents,a,mirrored,c3,s3);
}
function stamp(){
  const d=new Date(), p=v=>String(v).padStart(2,'0');
  return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function dl(name,data,mime){
  const u=URL.createObjectURL(new Blob([data],{type:mime}));
  const el=document.createElement('a');
  el.href=u; el.download=name;
  document.body.appendChild(el); el.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); el.remove(); },1500);
}
function doExport(fmt){
  const c=frozen?frozen.cloud:collectCloud();
  const n=c.pos.length/3, m=c.edges.length/2;
  if(!n){ toast('Хмара порожня — нема шо везти.'); return; }
  const nm=`axiom_cloud_${stamp()}.${fmt}`;
  if(fmt==='ply') dl(nm,writePLY(c),'text/plain');
  else if(fmt==='obj') dl(nm,writeOBJ(c),'text/plain');
  else dl(nm,writeGLB(c),'model/gltf-binary');
  toast(fmt.toUpperCase()+': '+n+' тчк / '+m+' ребер.');
}
const expop=$('expop');
$('m-efir').addEventListener('click',()=>setMode(false));
$('m-3d').addEventListener('click',()=>setMode(true));
$('b-freeze').addEventListener('click',()=>setFrozen(!frozen,false));
$('b-dive').addEventListener('click',()=>{ if(mode3d&&THREE) setFly(!fly,false); });
$('b-export').addEventListener('click',()=>expop.classList.toggle('open'));
$('e-ply').addEventListener('click',()=>{ expop.classList.remove('open'); doExport('ply'); });
$('e-obj').addEventListener('click',()=>{ expop.classList.remove('open'); doExport('obj'); });
$('e-glb').addEventListener('click',()=>{ expop.classList.remove('open'); doExport('glb'); });

// ── КНОПКИ І ЧІПИ ──────────────────────────────────────
$('b-flip').addEventListener('click',async ()=>{
  const b=$('b-flip');
  if(b.dataset.busy) return;
  b.dataset.busy='1'; b.classList.add('off');
  const prev=facing;
  facing = facing==='user' ? 'environment' : 'user';
  faceRes=gestRes=poseRes=objRes=null; segCache=null;
  gazeL=gazeR=null; hasPose=hasDist=false;
  clearInk();
  try{ await startCam(facing); }
  catch(_){ facing=prev; try{ await startCam(facing); }catch(_2){} }
  applyMirror();
  delete b.dataset.busy; b.classList.remove('off');
});
$('b-layers').addEventListener('click',()=>panel.classList.toggle('open'));
const CHIP_RES={
  face:()=>{ faceRes=null; gazeL=gazeR=null; hasPose=hasDist=false; },
  gest:()=>{ gestRes=null; },
  pose:()=>{ poseRes=null; },
  seg:()=>{ segCache=null; },
  obj:()=>{ objRes=null; }
};
for(const k of ['face','gest','pose','seg','obj']){
  const el=$('c-'+k);
  el.classList.toggle('off',!layer[k]);
  el.addEventListener('click',()=>{
    if(dead[k]){ toast('Ця модель не завантажилась.'); return; }
    layer[k]=!layer[k];
    if(!layer[k]) CHIP_RES[k]();
    el.classList.toggle('off',!layer[k]);
  });
}
$('c-clear').addEventListener('click',()=>{ clearInk(); toast('Стерто. Як не було.'); });

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

// ── ШТОРКА НАЛАШТУВАНЬ ────────────────────────────────
const sheet=$('sheet'), shade=$('shade');
function sheetOpen(o){ sheet.classList.toggle('open',o); shade.classList.toggle('open',o); }
$('b-set').addEventListener('click',()=>sheetOpen(!sheet.classList.contains('open')));
shade.addEventListener('click',()=>sheetOpen(false));
{
  let sy=null;
  const grip=$('grip');
  grip.addEventListener('pointerdown',e=>{ sy=e.clientY; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove',e=>{
    if(sy===null) return;
    sheet.style.transform='translateY('+Math.max(0,e.clientY-sy)+'px)';
  });
  const end=e=>{
    if(sy===null) return;
    const d=e.clientY-sy; sy=null;
    sheet.style.transform='';
    if(d>80) sheetOpen(false);
  };
  grip.addEventListener('pointerup',end);
  grip.addEventListener('pointercancel',end);
}
const R=[
  ['r-br','v-br', c=>Math.round(c.br*100),  (c,v)=>{ c.br=v/100; vid.style.filter='brightness('+c.br+')'; }],
  ['r-ta','v-ta', c=>Math.round(c.ta*100),  (c,v)=>{ c.ta=v/100; }],
  ['r-lw','v-lw', c=>Math.round(c.lw*10),   (c,v)=>{ c.lw=v/10; }],
  ['r-thr','v-thr',c=>Math.round(c.thr*100),(c,v)=>{ c.thr=v/100; }],
  ['r-pt','v-pt', c=>Math.round(c.pt*100),  (c,v)=>{ c.pt=v/100; applyPt(); }],
  ['r-fs','v-fs', c=>Math.round(c.fs*100),  (c,v)=>{ c.fs=v/100; }]
];
const T=[
  ['g-tess','tessOn'],['g-bars','bars'],['g-pose','poseHud'],['g-gaze','gaze'],
  ['g-edge','edge'],['g-dim','dim'],['g-grid','grid']
];
function syncSheet(){
  for(const [rid,vid3,get] of R){ $(rid).value=String(get(cfg)); $(vid3).textContent=$(rid).value; }
  for(const [tid,key] of T){
    const el=$(tid);
    el.classList.toggle('off',!cfg[key]);
    el.textContent=cfg[key]?'ВКЛ':'ВИКЛ';
  }
}
for(const [rid,vid3,,set] of R){
  $(rid).addEventListener('input',()=>{
    set(cfg,parseInt($(rid).value,10));
    $(vid3).textContent=$(rid).value;
    saveCfg();
  });
}
for(const [tid,key] of T){
  $(tid).addEventListener('click',()=>{
    cfg[key]=!cfg[key];
    if(key==='grid'&&grid3) grid3.visible=cfg.grid;
    syncSheet(); saveCfg();
  });
}
$('s-reset').addEventListener('click',()=>{
  cfg={...CFG0};
  vid.style.filter='brightness('+cfg.br+')';
  if(grid3) grid3.visible=cfg.grid;
  applyPt();
  syncSheet(); saveCfg();
  toast('Скинуто в заводські.');
});
vid.style.filter='brightness('+cfg.br+')';
syncSheet();

// ── BOOT ───────────────────────────────────────────────
(async ()=>{
  try{
    st('Тягну нейронки з CDN…',5);
    const vp=initVision();
    vp.catch(()=>{});
    st('Дай добро на камеру, ша…',12);
    try{ await startCam(facing); }
    catch(e){ throw { kind:'cam', e }; }
    applyMirror();
    st('Камера є. Мізки ще їдуть…',18);
    try{ await vp; }
    catch(e){ throw { kind:'cdn', e }; }
    if(!FL&&!GR) throw { kind:'cdn', e:new Error('core') };
    st('Прогріваю делегатів…',95);
    try{
      let t=performance.now();
      if(vid.readyState>=2){
        for(const m of [FL,GR,PL,SG,OD]){
          if(!m) continue;
          t+=0.2;
          if(m===GR) m.recognizeForVideo(vid,t);
          else if(m===SG){
            const r=m.segmentForVideo(vid,t);
            if(r&&r.confidenceMasks) for(const mm of r.confidenceMasks){ try{ mm.close(); }catch(_){} }
          }
          else m.detectForVideo(vid,t);
        }
      }
    }catch(_){}
    st('Всьо. Погнали!',100);
    const miss=Object.keys(dead);
    for(const k of miss){ const el=$('c-'+k); if(el) el.classList.add('dead'); layer[k]=false; }
    running=true; schedule();
    setTimeout(()=>{
      loader.classList.add('out');
      setTimeout(()=>loader.remove(),600);
      if(miss.length){
        const NM={face:'ЛИЦЕ',gest:'ЖЕСТИ',pose:'ПОЗА',seg:'СЕГМ',obj:'ОБ\u02BCЄКТИ'};
        toast('Не доїхали: '+miss.map(k=>NM[k]).join(', '),2600);
      }
    },350);
    try{
      await navigator.wakeLock?.request('screen');
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible')
          navigator.wakeLock?.request('screen').catch(()=>{});
      });
    }catch(_){}
  }catch(err){
    const e=err.e||err;
    if(err.kind==='cam'){
      if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))
        fail('Камеру зарубали, брат. Дозволь доступ у налаштуваннях браузера і тисни «ЩЕ РАЗ».');
      else if(e&&e.name==='NotFoundError')
        fail('Камери не знайшов. Це шо за пристрій такий?');
      else
        fail('Камера впала: '+((e&&e.name)||'хз чого')+'. Спробуй «ЩЕ РАЗ».');
    }else if(err.kind==='cdn'){
      fail('CDN не доїхав — мережа шкутильгає. Тисни «ЩЕ РАЗ».');
    }else{
      fail('Шось пішло по бороді: '+((e&&e.name)||'')+'. Тисни «ЩЕ РАЗ».');
    }
  }
})();
</script>
