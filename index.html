<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Tactical OS</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { --neon: #00ff41; --dim-neon: rgba(0, 255, 65, 0.2); --alert: #ff003c; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; background: #000; color: var(--neon); font-family: 'Segoe UI', monospace; height: 100%; overflow: hidden; }

        /* Контейнер приложения */
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }

        /* Вьюпорт с видео */
        .viewport { position: relative; flex: 1; background: #050505; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video, #overlay { position: absolute; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.5s; }

        /* HUD элементы */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            padding: env(safe-area-inset-top) 15px 15px 15px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .hud-header { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .scanner-line { 
            position: absolute; width: 100%; height: 2px; background: var(--dim-neon);
            box-shadow: 0 0 10px var(--neon); animation: scan 3s linear infinite;
        }

        /* Лог событий */
        .event-log {
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--dim-neon);
            height: 120px; overflow-y: auto; padding: 10px; font-size: 11px;
            pointer-events: auto; backdrop-filter: blur(5px);
        }
        .log-entry { margin-bottom: 4px; border-left: 2px solid var(--neon); padding-left: 5px; animation: slideIn 0.3s ease; }

        /* Панель управления (Touch-optimized) */
        .controls {
            background: #111; border-top: 1px solid var(--neon);
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; padding: 5px;
        }
        .btn {
            background: #1a1a1a; border: none; color: var(--neon);
            padding: 20px 10px; font-size: 10px; font-weight: bold;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn:active { background: var(--neon); color: #000; transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; }

        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="viewport">
        <div class="scanner-line"></div>
        <video id="webcam" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        
        <div class="hud-overlay">
            <div class="hud-header">
                <div id="sys-status">SYS: READY</div>
                <div id="clock">00:00:00</div>
            </div>
            
            <div class="event-log" id="log">
                <div class="log-entry">SYSTEM READY. WAITING FOR INITIATION...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="startBtn" onclick="initSystem()">Boot AI</button>
        <button class="btn" onclick="exportPDF()">Export PDF</button>
        <button class="btn" onclick="switchCamera()">Switch</button>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const logContainer = document.getElementById('log');
    
    let model;
    let eventHistory = [];
    let currentFacing = "user";

    // Обновление часов
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    async function initSystem() {
        document.getElementById('sys-status').innerText = "BOOTING...";
        document.getElementById('startBtn').disabled = true;

        try {
            // Загрузка COCO-SSD
            model = await cocossd.load();
            addLog("MODEL: COCO-SSD LOADED");

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacing, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                addLog("CAMERA: ACTIVE");
                document.getElementById('sys-status').innerText = "SCANNING";
                detectFrame();
            };
        } catch (e) {
            addLog("ERROR: " + e.message);
        }
    }

    async function detectFrame() {
        if (!model) return;
        
        const predictions = await model.detect(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        predictions.forEach(p => {
            const [x, y, width, height] = p.bbox;
            
            // Рисуем рамку
            ctx.strokeStyle = "#00ff41";
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);
            
            // Заливка текста
            ctx.fillStyle = "#00ff41";
            ctx.font = "18px monospace";
            ctx.fillText(`${p.class.toUpperCase()} [${Math.round(p.score * 100)}%]`, x, y > 20 ? y - 10 : 20);

            // Логируем только значимые события (уверенность > 70%)
            if (p.score > 0.7) {
                checkAndLogEvent(p.class);
            }
        });

        requestAnimationFrame(detectFrame);
    }

    function checkAndLogEvent(label) {
        const lastEvent = eventHistory[eventHistory.length - 1];
        const now = new Date();
        
        // Логируем, если объект новый или прошло более 5 секунд с прошлого раза
        if (!lastEvent || lastEvent.label !== label || (now - lastEvent.time) > 5000) {
            const entry = { label, time: now, timeStr: now.toLocaleTimeString() };
            eventHistory.push(entry);
            addLog(`DETECTED: ${label.toUpperCase()}`);
        }
    }

    function addLog(msg) {
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logContainer.prepend(div);
    }

    // Экспорт в PDF (через jsPDF)
    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFont("courier");
        doc.text("TACTICAL AI HUB - EVENT LOG", 10, 10);
        doc.text("----------------------------", 10, 15);
        
        let y = 25;
        eventHistory.forEach((ev, i) => {
            doc.text(`${i+1}. [${ev.timeStr}] OBJECT: ${ev.label}`, 10, y);
            y += 7;
            if (y > 280) { doc.addPage(); y = 20; }
        });

        doc.save(`log_${Date.now()}.pdf`);
        addLog("SYSTEM: PDF EXPORTED");
    }

    async function switchCamera() {
        currentFacing = currentFacing === "user" ? "environment" : "user";
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
            initSystem();
        }
    }
</script>
</body>
</html>
