<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TACTICAL SCANNER PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="cvReady();"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #btn-start {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; background: #000; border: 2px solid #0f0; color: #0f0;
            font-size: 1.2rem; cursor: pointer; z-index: 100; box-shadow: 0 0 20px #0f0;
        }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            background: repeating-linear-gradient(0deg, transparent 0px, rgba(0,255,0,0.05) 1px, transparent 2px);
            border: 10px solid rgba(0, 255, 0, 0.1); box-sizing: border-box;
        }
        .hud { position: fixed; z-index: 10; font-size: 10px; text-transform: uppercase; padding: 10px; }
        .top-left { top: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; text-align: right; }
        video { position: absolute; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>

    <button id="btn-start">ACTIVATE SYSTEM</button>
    
    <div id="overlay"></div>
    <div class="hud top-left">SCANNER: ACTIVE<br>SENSORS: CV_CANNY_EDGE</div>
    <div class="hud bottom-right">BATTERY: 94%<br>FPS: <span id="fps-val">0</span></div>

    <video id="videoInput" playsinline muted></video>

    <script>
        let video = document.getElementById('videoInput');
        let btn = document.getElementById('btn-start');
        let isCvLoaded = false;
        let renderer, scene, camera, texture, hiddenCanvas, ctx;
        let src, dst, cap;

        function cvReady() {
            isCvLoaded = true;
            btn.innerText = "START SCANNER";
        }

        btn.onclick = async () => {
            if (!isCvLoaded) return alert("Система загружается, подожди секунду...");
            btn.style.display = 'none';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: 640, height: 480 }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.play();
                
                // Ждем, пока видео реально начнет отдавать кадры и размеры
                video.onloadedmetadata = () => {
                    initThreeJS();
                };
            } catch (err) {
                alert("Ошибка доступа: " + err);
            }
        };

        function initThreeJS() {
            const width = video.videoWidth;
            const height = video.videoHeight;

            // Настройка сцены
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Холст для обработки
            hiddenCanvas = document.createElement('canvas');
            hiddenCanvas.width = width;
            hiddenCanvas.height = height;
            ctx = hiddenCanvas.getContext('2d');

            // Текстура с холста
            texture = new THREE.CanvasTexture(hiddenCanvas);
            const geometry = new THREE.PlaneGeometry(2, 2);
            // Используем ярко-зеленый цвет для линий
            const material = new THREE.MeshBasicMaterial({ map: texture, color: 0x33ff33 });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Инициализация OpenCV матриц строго по размеру видео
            src = new cv.Mat(height, width, cv.CV_8UC4);
            dst = new cv.Mat(height, width, cv.CV_8UC1);
            cap = new cv.VideoCapture(video);

            requestAnimationFrame(processFrame);
        }

        let lastTime = 0;
        function processFrame(time) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                cap.read(src);
                
                // 1. В ч/б
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
                
                // 2. Детекция краев (Canny)
                // Снизил пороги для лучшей видимости в темноте
                cv.Canny(dst, dst, 30, 80, 3, false);
                
                // 3. Рисуем результат на промежуточный холст
                cv.imshow(hiddenCanvas, dst);

                // 4. Обновляем Three.js
                texture.needsUpdate = true;
                
                // Индикация FPS
                if (time - lastTime > 500) {
                    document.getElementById('fps-val').innerText = Math.round(1000 / (time - lastTime + 0.1) * 10);
                    lastTime = time;
                }
            }

            renderer.render(scene, camera);
            requestAnimationFrame(processFrame);
        }

        window.onresize = () => {
            if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
